<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>PM · Team Lead</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- ============ SHARED THEME (single source of truth) ============ -->
    <link rel="stylesheet" th:href="@{/css/menti-theme.css}" href="../../static/css/menti-theme.css">
    <link rel="stylesheet" th:href="@{/css/menti-ai.css}" href="../../static/css/menti-ai.css">
    <style>
        :root{color-scheme:dark;--bg:#0f172a;--bg2:#131c31;--card:#1e293b;--card2:#243347;--bd:#2a3950;--bd2:#3b4d6a;--tx:#f1f5f9;--tx2:#94a3b8;--tx3:#64748b;--pri:#6366f1;--pri-h:#4f46e5;--pri-soft:rgba(99,102,241,.12);--suc:#10b981;--suc-soft:rgba(16,185,129,.14);--dng:#ef4444;--dng-soft:rgba(239,68,68,.14);--wrn:#f59e0b;--wrn-soft:rgba(245,158,11,.14);--inf:#0ea5e9;--inf-soft:rgba(14,165,233,.14);--pur:#a855f7;--pur-soft:rgba(168,85,247,.14);--sb:232px;--sb-c:56px;--hh:46px;--r:6px;--rl:8px;--fs-xs:10.5px;--fs-sm:11.5px;--fs:12.5px;--fs-md:13.5px;--fs-lg:15px;--fs-xl:18px;--fs-2xl:22px;--t:180ms cubic-bezier(.4,0,.2,1);--t-fast:120ms cubic-bezier(.4,0,.2,1);--sh:0 4px 12px rgba(0,0,0,.35);--sh-lg:0 12px 40px rgba(0,0,0,.5);--z-sb:1000;--z-h:900;--z-ts:1600}
        .pm-light{color-scheme:light;--bg:#f8fafc;--bg2:#fff;--card:#fff;--card2:#f1f5f9;--bd:#e2e8f0;--bd2:#cbd5e1;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{font-family:'Inter',sans-serif;font-size:var(--fs);line-height:1.45;background:var(--bg);color:var(--tx);overflow-x:hidden;-webkit-font-smoothing:antialiased}
        ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:6px}
        a{color:var(--pri);text-decoration:none}
        button{font-family:inherit}
        .pm-shell{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh;transition:grid-template-columns var(--t)}
        .pm-shell.collapsed{grid-template-columns:var(--sb-c) 1fr}
        .pm-sidebar{position:sticky;top:0;height:100vh;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;z-index:var(--z-sb)}
        .pm-brand{display:flex;align-items:center;gap:8px;padding:10px 12px;height:var(--hh);border-bottom:1px solid var(--bd);flex-shrink:0}
        .pm-brand-logo{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--pri),var(--pur));display:grid;place-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
        .pm-brand-name{font-weight:600;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
        .pm-shell.collapsed .pm-brand-name,.pm-shell.collapsed .pm-nav-section,.pm-shell.collapsed .pm-nav-label,.pm-shell.collapsed .pm-nav-badge{display:none}
        .pm-sidebar-scroll{flex:1;overflow-y:auto;padding:6px 6px 20px}
        .pm-nav-section{padding:12px 10px 4px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:6px}
        .pm-nav-section i{font-size:9px;color:var(--pri)}
        .pm-nav-link{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r);color:var(--tx2);font-size:var(--fs);font-weight:500;transition:background var(--t-fast),color var(--t-fast);cursor:pointer;white-space:nowrap;margin:1px 0}
        .pm-nav-link:hover{background:var(--card2);color:var(--tx)}
        .pm-nav-link.active{background:var(--pri-soft);color:var(--pri)}
        .pm-nav-link i{width:16px;text-align:center;font-size:12.5px;flex-shrink:0}
        .pm-nav-label{flex:1;overflow:hidden;text-overflow:ellipsis}
        .pm-nav-badge{background:var(--pri);color:#fff;font-size:var(--fs-xs);font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
        .pm-main{min-width:0;display:flex;flex-direction:column}
        .pm-header{position:sticky;top:0;z-index:var(--z-h);height:var(--hh);background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:0 10px;flex-shrink:0}
        .pm-iconbtn{width:30px;height:30px;border-radius:var(--r);border:1px solid var(--bd);background:transparent;color:var(--tx2);display:grid;place-content:center;cursor:pointer;font-size:12px;transition:var(--t-fast);position:relative;flex-shrink:0}
        .pm-iconbtn:hover{color:var(--tx);border-color:var(--pri)}
        .pm-header-right{display:flex;align-items:center;gap:6px;margin-left:auto}
        .pm-live{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);color:var(--tx3);font-weight:600;padding:0 6px}
        .pm-live .dot{width:6px;height:6px;border-radius:50%;background:var(--suc)}
        .pm-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pur));color:#fff;font-weight:700;font-size:11px;display:grid;place-content:center;cursor:pointer;flex-shrink:0}
        .pm-content{padding:12px 14px;flex:1;min-width:0}
        .pm-breadcrumb{font-size:var(--fs-sm);color:var(--tx3);margin-bottom:8px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
        .pm-breadcrumb a{color:var(--tx3)}.pm-breadcrumb a:hover{color:var(--pri)}
        .pm-page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
        .pm-page-title{font-size:var(--fs-xl);font-weight:600;display:flex;align-items:center;gap:8px}
        .pm-page-title i{color:var(--pri);font-size:15px}
        .pm-page-sub{font-size:var(--fs-sm);color:var(--tx2);margin-top:2px}
        .pm-page-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
        .pm-btn{height:28px;padding:0 10px;border-radius:var(--r);border:1px solid var(--bd);background:transparent;color:var(--tx);font-size:var(--fs);font-weight:500;display:inline-flex;align-items:center;gap:5px;cursor:pointer;transition:var(--t-fast);white-space:nowrap}
        .pm-btn:hover{border-color:var(--pri);color:var(--pri)}
        .pm-btn:disabled{opacity:.5;cursor:default}
        .pm-btn i{font-size:11px}
        .pm-btn-primary{background:var(--pri);border-color:var(--pri);color:#fff}
        .pm-btn-primary:hover{background:var(--pri-h);border-color:var(--pri-h);color:#fff}
        .pm-btn-sm{height:22px;padding:0 8px;font-size:var(--fs-sm)}
        .pm-btn-ok{color:var(--suc);border-color:rgba(16,185,129,.35)}
        .pm-btn-ok:hover{background:var(--suc-soft);border-color:var(--suc);color:var(--suc)}
        .pm-btn-danger{color:var(--dng);border-color:rgba(239,68,68,.3)}
        .pm-btn-danger:hover{border-color:var(--dng);color:var(--dng);background:var(--dng-soft)}
        .pm-select{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);padding:0 8px;font-family:inherit;font-size:var(--fs);outline:none;height:28px;min-width:0}
        .pm-select:focus{border-color:var(--pri)}
        .pm-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);padding:10px 12px;min-width:0}
        .pm-badge{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:10px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap;line-height:1.6}
        .pm-badge.primary{background:var(--pri-soft);color:var(--pri)}.pm-badge.success{background:var(--suc-soft);color:var(--suc)}
        .pm-badge.danger{background:var(--dng-soft);color:var(--dng)}.pm-badge.warning{background:var(--wrn-soft);color:var(--wrn)}
        .pm-badge.info{background:var(--inf-soft);color:var(--inf)}.pm-badge.purple{background:var(--pur-soft);color:var(--pur)}
        .pm-progress{height:5px;background:var(--bg);border-radius:10px;overflow:hidden;width:100%}
        .pm-progress-bar{height:100%;background:var(--suc);border-radius:10px;transition:width 300ms ease}
        .pm-progress-bar.warning{background:var(--wrn)}.pm-progress-bar.danger{background:var(--dng)}
        .pm-toasts{position:fixed;top:12px;right:12px;z-index:var(--z-ts);display:flex;flex-direction:column;gap:6px;max-width:340px;pointer-events:none}
        .pm-toast{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--pri);border-radius:var(--rl);padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:var(--sh);transform:translateX(120%);transition:transform 280ms cubic-bezier(.4,0,.2,1);pointer-events:auto;cursor:pointer}
        .pm-toast.show{transform:translateX(0)}
        .pm-toast.success{border-left-color:var(--suc)}.pm-toast.error{border-left-color:var(--dng)}.pm-toast.warning{border-left-color:var(--wrn)}
        .pm-toast-icon{width:22px;height:22px;border-radius:50%;display:grid;place-content:center;color:#fff;font-size:10px;flex-shrink:0;background:var(--inf)}
        .pm-toast.success .pm-toast-icon{background:var(--suc)}.pm-toast.error .pm-toast-icon{background:var(--dng)}.pm-toast.warning .pm-toast-icon{background:var(--wrn)}
        .pm-toast-msg{flex:1;font-size:var(--fs);font-weight:500}
        .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
        .kpi{background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);padding:8px 10px}
        .kpi-icon{width:24px;height:24px;border-radius:var(--r);display:grid;place-content:center;font-size:11px;margin-bottom:4px}
        .kpi-icon.blue{background:var(--pri-soft);color:var(--pri)}.kpi-icon.green{background:var(--suc-soft);color:var(--suc)}
        .kpi-icon.red{background:var(--dng-soft);color:var(--dng)}.kpi-icon.orange{background:var(--wrn-soft);color:var(--wrn)}
        .kpi-icon.cyan{background:var(--inf-soft);color:var(--inf)}.kpi-icon.purple{background:var(--pur-soft);color:var(--pur)}
        .kpi-value{font-size:var(--fs-2xl);font-weight:700;line-height:1}
        .kpi-label{font-size:var(--fs-sm);color:var(--tx2);margin-top:2px}
        .priority-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
        .p-h{background:var(--dng)}.p-m{background:var(--wrn)}.p-l{background:var(--suc)}.p-c{background:#dc2626;box-shadow:0 0 0 2px rgba(220,38,38,.3)}
        .tl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:10px}
        .tl-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
        .tl-card-title{font-weight:600;font-size:var(--fs-md);display:flex;align-items:center;gap:6px}
        .tl-card-title i{color:var(--pri)}
        .tl-body{max-height:360px;overflow-y:auto}
        .tl-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--bd);background:var(--bg);border-radius:var(--r);margin-bottom:6px}
        .tl-row-body{flex:1;min-width:0}
        .tl-row-title{display:block;font-size:var(--fs);font-weight:500;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .tl-row-title:hover{color:var(--pri)}
        .tl-row-meta{font-size:var(--fs-xs);color:var(--tx3);margin-top:1px;display:flex;gap:10px;flex-wrap:wrap}
        .tl-od{color:var(--dng);font-weight:600}
        .tl-actions{display:flex;gap:5px;align-items:center;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
        .tl-empty{text-align:center;padding:22px 10px;color:var(--tx3);font-size:var(--fs-sm)}
        .tl-empty i{display:block;font-size:22px;opacity:.35;margin-bottom:6px}
        .tl-wl{display:grid;grid-template-columns:1.4fr 1fr 70px;gap:10px;align-items:center;padding:6px 2px;border-bottom:1px solid var(--bd)}
        .tl-wl:last-child{border-bottom:none}
        .tl-wl-name{font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
        .tl-wl-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .av-md{width:26px;height:26px;border-radius:50%;background:var(--pri);color:#fff;font-size:10px;font-weight:700;display:grid;place-content:center;flex-shrink:0}
        .tl-sub{font-size:var(--fs-xs);color:var(--tx3)}
        .mob-toggle{display:none;position:fixed;top:.5rem;left:.5rem;z-index:1100;width:34px;height:34px;background:var(--card);border:1px solid var(--bd);border-radius:6px;color:var(--tx);cursor:pointer;place-content:center}
        @media(max-width:900px){.pm-shell{grid-template-columns:1fr}.pm-sidebar{position:fixed;transform:translateX(-100%);transition:transform var(--t);width:var(--sb)}.pm-sidebar.open{transform:translateX(0)}.mob-toggle{display:grid}.pm-header{padding-left:2.5rem}.tl-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<button class="mob-toggle" id="mobToggle"><i class="fas fa-bars"></i></button>

<div class="pm-shell" id="pmShell">
    <aside class="pm-sidebar" id="pmSidebar">
        <div class="pm-brand"><div class="pm-brand-logo">M</div><div class="pm-brand-name">Menti's PM</div></div>
        <div class="pm-sidebar-scroll" id="pmSidebarNav"></div>
    </aside>

    <div class="pm-main">
        <header class="pm-header">
            <button class="pm-iconbtn" onclick="PM.toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="pm-header-right">
                <div class="pm-live"><span class="dot"></span> Live</div>
                <button class="pm-iconbtn" onclick="PM.toggleTheme()"><i class="fas fa-moon"></i></button>
                <button class="pm-iconbtn" onclick="location.href='/pm/02-inbox?tab=notifications'" title="Notifications"><i class="fas fa-bell"></i></button>
                <div class="pm-avatar" id="pmUserAvatar" title="Loading...">?</div>
            </div>
        </header>

        <div class="pm-content">
            <div class="pm-breadcrumb"><a href="/pm/01-home"><i class="fas fa-house"></i></a> / Dashboard / <span>Team Lead</span></div>

            <div class="pm-page-head">
                <div>
                    <div class="pm-page-title"><i class="fas fa-user-tie"></i> Team Lead Dashboard</div>
                    <div class="pm-page-sub" id="pageSub">Loading your team…</div>
                </div>
                <div class="pm-page-actions">
                    <a class="pm-btn" href="/pm/03-my-work"><i class="fas fa-inbox"></i> My Work</a>
                    <select class="pm-select" id="teamSel" style="display:none;max-width:220px"></select>
                    <button class="pm-btn" id="btnRefresh"><i class="fas fa-rotate"></i> Refresh</button>
                    <a class="pm-btn pm-btn-primary" id="btnBoard" href="/pm/06-tasks"><i class="fas fa-table-columns"></i> Team task board</a>
                </div>
            </div>

            <div class="kpi-grid" id="kpis"></div>

            <div class="tl-grid">
                <section class="pm-card">
                    <div class="tl-card-head"><div class="tl-card-title"><i class="fas fa-magnifying-glass-chart"></i> Review queue</div><span class="pm-badge info" id="cntReview">0</span></div>
                    <div class="tl-body" id="bodyReview"></div>
                </section>

                <section class="pm-card">
                    <div class="tl-card-head"><div class="tl-card-title"><i class="fas fa-square-check"></i> Waiting for my decision</div><span class="pm-badge warning" id="cntApprovals">0</span></div>
                    <div class="tl-body" id="bodyApprovals"></div>
                </section>

                <section class="pm-card">
                    <div class="tl-card-head"><div class="tl-card-title"><i class="fas fa-user-plus"></i> Unassigned team tasks</div><span class="pm-badge primary" id="cntUnassigned">0</span></div>
                    <div class="tl-body" id="bodyUnassigned"></div>
                </section>

                <section class="pm-card">
                    <div class="tl-card-head"><div class="tl-card-title"><i class="fas fa-users-gear"></i> Team workload</div><span class="pm-badge purple" id="cntMembers">0</span></div>
                    <div class="tl-body" id="bodyWorkload"></div>
                </section>

                <section class="pm-card">
                    <div class="tl-card-head"><div class="tl-card-title"><i class="fas fa-clock"></i> Overdue and due in 3 days</div><span class="pm-badge danger" id="cntDue">0</span></div>
                    <div class="tl-body" id="bodyDue"></div>
                </section>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.2/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script src="/pm/pm-core.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/pm/js/pm-lead-change.js"></script>
<script>
    PMLead.onDone = function () { loadTeams(); };      // ADAPT: the function that reloads your team list
</script>
<!-- Shared sidebar controller (accordion + search + rail + mobile) -->
<script th:src="@{/js/menti-sidebar.js}" src="../../static/js/menti-sidebar.js"></script>
<script src="/pm/js/pm-lead-change.js"></script>
<script>
    PMLead.onDone = function () { loadTeams(); };      // ADAPT: ...
</script>
<!-- Shared AI assistant controller -->
<script th:src="@{/js/menti-ai.js}" src="../../static/js/menti-ai.js"></script>
<script>
    PM.bootstrap().then(function (me) {
      var myId = me.id;
      var leadIds = me.leadOfTeamIds || [];
      var S = { teamId: null, teamName: '', members: [], tasks: [], approvals: [], hours: [] };
      var $ = function (id) { return document.getElementById(id); };
      var today = new Date(); today.setHours(0, 0, 0, 0);

      function isOpen(t) { return t.status !== 'DONE'; }
      function isOverdue(t) { return !!t.dueDate && isOpen(t) && new Date(t.dueDate) < today; }
      function isSoon(t) {
        if (!t.dueDate || !isOpen(t)) return false;
        var d = (new Date(t.dueDate) - today) / 86400000;
        return d >= 0 && d <= 3;
      }
      function hasAssignee(t) { return (t.assigneeIds || []).length > 0; }
      function empty(msg, icon) { return '<div class="tl-empty"><i class="fas ' + (icon || 'fa-circle-check') + '"></i>' + PM.esc(msg) + '</div>'; }

      function taskRow(t, actions) {
        var p = String(t.priority || 'MEDIUM').toUpperCase();
        var dot = p === 'CRITICAL' ? 'p-c' : p === 'HIGH' ? 'p-h' : p === 'MEDIUM' ? 'p-m' : 'p-l';
        var od = isOverdue(t);
        var names = (t.assigneeNames || []).join(', ');
        return '<div class="tl-row"><span class="priority-dot ' + dot + '"></span><div class="tl-row-body">' +
               (t.projectId
        ? '<a class="tl-row-title" href="/pm/06-tasks?open=' + t.id + '">' + PM.esc(t.title) + '</a>'
        : '<span class="tl-row-title" style="cursor:default;color:var(--tx3)" title="You do not have access to this project">' + PM.esc(t.title) + '</span>') +
          '<div class="tl-row-meta"><span>' + PM.esc(t.projectName || '—') + '</span>' +
          '<span class="' + (od ? 'tl-od' : '') + '"><i class="fas fa-calendar"></i> ' + (t.dueDate ? PM.fmtDate(t.dueDate) : 'No due date') + (od ? ' · overdue' : '') + '</span>' +
          (names ? '<span><i class="fas fa-user"></i> ' + PM.esc(names) + '</span>' : '') +
          '</div></div>' + (actions ? '<div class="tl-actions">' + actions + '</div>' : '') + '</div>';
      }

      async function loadApprovals() {
        // /mine and /requested are both fetched; only pending items where I am the approver are kept
        var lists = await Promise.allSettled([
          PM.apiList('GET', '/api/pm/approvals/mine'),
          PM.apiList('GET', '/api/pm/approvals/requested')
        ]);
        var byId = {};
        lists.forEach(function (r) { if (r.status === 'fulfilled') r.value.forEach(function (a) { byId[a.id] = a; }); });
        var closed = ['APPROVED', 'REJECTED', 'CANCELLED', 'CANCELED', 'WITHDRAWN'];
        return Object.keys(byId).map(function (k) { return byId[k]; }).filter(function (a) {
          return a.approverId === myId && closed.indexOf(String(a.status || '').toUpperCase()) < 0;
        });
      }

      async function load() {
        if (!S.teamId) return;
        var tid = S.teamId;
        var r = await Promise.allSettled([
          PM.api('GET', '/api/pm/teams/' + tid + '/tasks?limit=300'),
          PM.api('GET', '/api/pm/teams/' + tid + '/members/details'),
          loadApprovals(),
          PM.api('GET', '/api/pm/timesheets/team/' + tid)
        ]);
        if (tid !== S.teamId) return; // person switched team while loading
        if (r[0].status === 'rejected') PM.toast('Could not load team tasks: ' + r[0].reason.message, 'error');
        var td = r[0].status === 'fulfilled' ? r[0].value : null;
        S.tasks = td && td.tasks ? td.tasks : [];
        if (td && td.team && td.team.name) S.teamName = td.team.name;
        S.members = r[1].status === 'fulfilled' ? (r[1].value || []) : [];
        S.approvals = r[2].status === 'fulfilled' ? r[2].value : [];
        S.hours = r[3].status === 'fulfilled' ? (r[3].value || []) : [];
        render();
      }

      function render() {
        var open = S.tasks.filter(isOpen);
        var review = S.tasks.filter(function (t) { return t.status === 'IN_REVIEW'; });
        var unassigned = open.filter(function (t) { return !hasAssignee(t); });
        var overdue = S.tasks.filter(isOverdue);
        var due = S.tasks.filter(function (t) { return isOverdue(t) || isSoon(t); })
          .sort(function (a, b) { return new Date(a.dueDate) - new Date(b.dueDate); });

        $('pageSub').textContent = (S.teamName || 'Your team') + ' · ' + S.members.length + ' members · ' + open.length + ' open tasks';
        $('btnBoard').href = '/pm/06-tasks?teamId=' + S.teamId;

        function kpi(icon, color, value, label) {
          return '<div class="kpi"><div class="kpi-icon ' + color + '"><i class="fas ' + icon + '"></i></div><div class="kpi-value">' + value + '</div><div class="kpi-label">' + label + '</div></div>';
        }
        $('kpis').innerHTML =
          kpi('fa-users', 'blue', S.members.length, 'Team members') +
          kpi('fa-list-check', 'cyan', open.length, 'Open tasks') +
          kpi('fa-user-plus', 'purple', unassigned.length, 'Unassigned') +
          kpi('fa-magnifying-glass-chart', 'green', review.length, 'In review (mine)') +
          kpi('fa-triangle-exclamation', 'red', overdue.length, 'Overdue') +
          kpi('fa-square-check', 'orange', S.approvals.length, 'Approvals waiting');

        // Review queue
        $('cntReview').textContent = review.length;
        $('bodyReview').innerHTML = review.length ? review.map(function (t) {
          return taskRow(t,
            '<button class="pm-btn pm-btn-sm pm-btn-ok" data-act="approve" data-id="' + t.id + '"><i class="fas fa-check"></i> Approve</button>' +
            '<button class="pm-btn pm-btn-sm pm-btn-danger" data-act="changes" data-id="' + t.id + '"><i class="fas fa-rotate-left"></i> Changes</button>');
        }).join('') : empty('Nothing waiting for review');

        // Approvals (extensions, sign-offs)
        $('cntApprovals').textContent = S.approvals.length;
        $('bodyApprovals').innerHTML = S.approvals.length ? S.approvals.map(function (a) {
          return '<div class="tl-row"><span class="pm-badge warning">' + PM.esc(a.entityType || 'REQUEST') + '</span><div class="tl-row-body">' +
            '<div class="tl-row-title" style="cursor:default">' + PM.esc(a.entityTitle || ('#' + a.entityId)) + '</div>' +
            '<div class="tl-row-meta"><span><i class="fas fa-user"></i> ' + PM.esc(a.requestedByName || '—') + '</span>' +
            (a.reason ? '<span>' + PM.esc(a.reason) + '</span>' : '') + '<span>' + PM.fmtDateTime(a.createdAt) + '</span></div></div>' +
            '<div class="tl-actions"><button class="pm-btn pm-btn-sm pm-btn-ok" data-act="ok" data-id="' + a.id + '"><i class="fas fa-check"></i> Approve</button>' +
            '<button class="pm-btn pm-btn-sm pm-btn-danger" data-act="no" data-id="' + a.id + '"><i class="fas fa-xmark"></i> Reject</button></div></div>';
        }).join('') : empty('No approvals waiting for you');

        // Unassigned
        var opts = '<option value="">Assign to…</option>' + S.members.map(function (m) {
          var n = open.filter(function (t) { return (t.assigneeIds || []).indexOf(m.employeeId) >= 0; }).length;
          return '<option value="' + m.employeeId + '">' + PM.esc(m.employeeName) + ' (' + n + ' open)</option>';
        }).join('');
        $('cntUnassigned').textContent = unassigned.length;
        $('bodyUnassigned').innerHTML = unassigned.length ? unassigned.map(function (t) {
          return taskRow(t,
            '<select class="pm-select" id="asg-' + t.id + '" style="max-width:160px">' + opts + '</select>' +
            '<button class="pm-btn pm-btn-sm pm-btn-primary" data-act="assign" data-id="' + t.id + '">Assign</button>');
        }).join('') : empty('Every open task has an owner');

        // Workload
        var hrsByCode = {}, hrsByName = {};
        S.hours.forEach(function (h) { hrsByCode[h.employeeId] = h.totalHours || 0; hrsByName[String(h.employeeName || '').toLowerCase()] = h.totalHours || 0; });
        var counts = S.members.map(function (m) { return open.filter(function (t) { return (t.assigneeIds || []).indexOf(m.employeeId) >= 0; }).length; });
        var maxOpen = Math.max.apply(null, counts.concat([1]));
        $('cntMembers').textContent = S.members.length;
        $('bodyWorkload').innerHTML = S.members.length ? S.members.map(function (m, i) {
          var mine = open.filter(function (t) { return (t.assigneeIds || []).indexOf(m.employeeId) >= 0; });
          var od = mine.filter(isOverdue).length;
          var hrs = hrsByCode[m.employeeCode];
          if (hrs == null) hrs = hrsByName[String(m.employeeName || '').toLowerCase()];
          var pct = Math.round((counts[i] / maxOpen) * 100);
          var cls = counts[i] > 6 ? 'danger' : counts[i] > 3 ? 'warning' : '';
          return '<div class="tl-wl"><div class="tl-wl-name"><div class="av-md">' + PM.getInitials(m.employeeName) + '</div><div style="min-width:0"><span>' + PM.esc(m.employeeName) + (m.lead ? ' <i class="fas fa-star" style="color:var(--wrn);font-size:9px" title="Team lead"></i>' : '') + '</span>' +
            '<div class="tl-sub">' + PM.esc(m.roleInTeam || '') + (m.allocationPct != null ? ' · ' + m.allocationPct + '%' : '') + '</div></div></div>' +
            '<div><div class="pm-progress"><div class="pm-progress-bar ' + cls + '" style="width:' + pct + '%"></div></div>' +
            '<div class="tl-sub" style="margin-top:3px">' + counts[i] + ' open' + (od ? ' · <span class="tl-od">' + od + ' overdue</span>' : '') + '</div></div>' +
            '<div style="text-align:right;font-weight:700">' + (hrs != null ? Math.round(hrs) + 'h' : '—') + '<div class="tl-sub">this week</div></div></div>';
        }).join('') : empty('No members yet. Ask a Super Admin or the team creator.', 'fa-users');

        // Due soon / overdue
        $('cntDue').textContent = due.length;
        $('bodyDue').innerHTML = due.length ? due.map(function (t) { return taskRow(t, ''); }).join('') : empty('Nothing overdue or due soon');
      }

      // ── actions (event delegation) ──
      document.addEventListener('click', async function (e) {
        var b = e.target.closest('[data-act]'); if (!b) return;
        var act = b.dataset.act, id = Number(b.dataset.id);
        b.disabled = true;
        try {
          if (act === 'approve') {
            await PM.api('PATCH', '/api/pm/tasks/' + id + '/status', { status: 'DONE' });
            PM.toast('Approved and moved to Done', 'success');
          } else if (act === 'changes') {
            await PM.api('PATCH', '/api/pm/tasks/' + id + '/status', { status: 'IN_PROGRESS' });
            PM.toast('Sent back to In Progress. Open the task to leave a comment.', 'info');
          } else if (act === 'assign') {
            var sel = $('asg-' + id);
            if (!sel || !sel.value) { PM.toast('Pick a person first', 'warning'); b.disabled = false; return; }
            await PM.api('PATCH', '/api/pm/tasks/' + id + '/assign', { employeeIds: [Number(sel.value)] });
            PM.toast('Task assigned', 'success');
          } else if (act === 'ok' || act === 'no') {
            var note = '';
            if (act === 'no') { note = prompt('Reason for rejecting (optional):', ''); if (note === null) { b.disabled = false; return; } }
            await PM.api('POST', '/api/pm/approvals/' + id + '/decide', { decision: act === 'ok' ? 'APPROVED' : 'REJECTED', note: note || null });
            PM.toast(act === 'ok' ? 'Approved' : 'Rejected', act === 'ok' ? 'success' : 'info');
          }
          PM.invalidateMeCaches();
          await load();
        } catch (err) {
          PM.toast(err.message || 'Action failed', 'error');
          b.disabled = false;
        }
      });

      // ── team picker ──
      async function init() {
        if (!leadIds.length) { $('pageSub').textContent = 'You do not lead a team.'; return; }
        var names = {};
        try { (await PM.api('GET', '/api/pm/teams/cards') || []).forEach(function (c) { names[c.id] = c.name; }); } catch (e) { /* names fall back to ids */ }
        var sel = $('teamSel');
        sel.innerHTML = leadIds.map(function (id) { return '<option value="' + id + '">' + PM.esc(names[id] || ('Team #' + id)) + '</option>'; }).join('');
        var q = Number(new URLSearchParams(location.search).get('teamId'));
        S.teamId = leadIds.indexOf(q) >= 0 ? q : leadIds[0];
        S.teamName = names[S.teamId] || '';
        sel.value = S.teamId;
        sel.style.display = leadIds.length > 1 ? '' : 'none';
        sel.addEventListener('change', function () { S.teamId = Number(sel.value); S.teamName = names[S.teamId] || ''; load(); });
        await load();
      }

      $('btnRefresh').addEventListener('click', load);
      $('mobToggle').addEventListener('click', function () { $('pmSidebar').classList.toggle('open'); });
      window.pmRefresh = load; // realtime: any PM event reloads the dashboard
      init();
    });
</script>
</body>
</html>
