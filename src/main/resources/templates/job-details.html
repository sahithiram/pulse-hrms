<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Job Details - ' + ${job.title}">Job Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/menti-theme.css}" href="../../static/css/menti-theme.css">
    <link rel="stylesheet" th:href="@{/css/menti-ai.css}" href="../../static/css/menti-ai.css">

    <style>
        /* Page-specific — job detail card */
        .details-card {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: var(--radius-card);
            padding: 2rem;
            max-width: 900px;
            margin: 0 auto;
        }
        .badge-status {
            background: var(--success);
            color: #fff;
            padding: .35rem .9rem;
            border-radius: var(--radius-pill);
            font-weight: 600;
            font-size: .8rem;
        }
        .badge-status.closed {
            background: var(--danger);
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin: 1.5rem 0;
            padding: 1.5rem;
            background: var(--dark-bg);
            border-radius: 8px;
            border: 1px solid var(--dark-border);
        }
        .info-item label {
            color: var(--dark-text-secondary);
            font-weight: 600;
            display: block;
            margin-bottom: .3rem;
            font-size: .8rem;
        }
        .info-item span {
            color: var(--dark-text);
            font-size: 1rem;
        }
        .actions {
            margin-top: 2rem;
            display: flex;
            gap: 1rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--dark-border);
            flex-wrap: wrap;
        }
        .btn-custom {
            padding: .65rem 1.25rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: .4rem;
        }
        .btn-edit {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: white;
            border: none;
        }
        .btn-edit:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-primary);
        }
        .btn-back {
            background: transparent;
            color: var(--dark-text-secondary);
            border: 1px solid var(--dark-border);
        }
        .btn-back:hover {
            background: var(--sidebar-hover);
            color: var(--dark-text);
        }
    </style>
</head>
<body>

<!-- === SHARED SIDEBAR (job-postings active) === -->
<div th:replace="~{fragments/layout :: sidebar('job-postings')}"></div>

<div class="main-content">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <div class="content-area">

        <div class="details-card">
            <div class="d-flex justify-content-between align-items-center mb-2" style="gap: 1rem; flex-wrap: wrap;">
                <h2 th:text="${job.title}" style="margin:0; color: var(--primary); font-weight: 700;">Job Title</h2>
                <span class="badge-status"
                      th:classappend="${!job.active} ? 'closed' : ''"
                      th:text="${job.active ? 'Active' : 'Closed'}">Status</span>
            </div>

            <div class="info-grid">
                <div class="info-item">
                    <label><i class="fas fa-building me-2"></i>Department:</label>
                    <span th:text="${job.department}">—</span>
                </div>
                <div class="info-item">
                    <label><i class="fas fa-clock me-2"></i>Job Type:</label>
                    <span th:text="${job.jobType}">—</span>
                </div>
                <div class="info-item">
                    <label><i class="fas fa-map-marker-alt me-2"></i>Location:</label>
                    <span th:text="${job.location}">—</span>
                </div>
                <div class="info-item">
                    <label><i class="fas fa-briefcase me-2"></i>Experience Level:</label>
                    <span th:text="${job.experienceLevel}">—</span>
                </div>
                <div class="info-item">
                    <label><i class="fas fa-money-bill-wave me-2"></i>Salary Range:</label>
                    <span th:text="${job.salaryRange}">—</span>
                </div>
                <div class="info-item">
                    <label><i class="fas fa-calendar-alt me-2"></i>Posted Date:</label>
                    <span th:text="${job.formattedPostedDate}">—</span>
                </div>
            </div>

            <div class="mt-4">
                <h4 style="color: var(--dark-text-secondary); border-bottom: 1px solid var(--dark-border); padding-bottom: .5rem;">Description</h4>
                <p th:text="${job.description}" style="line-height: 1.7; color: var(--dark-text);">—</p>
            </div>

            <div class="mt-4">
                <h4 style="color: var(--dark-text-secondary); border-bottom: 1px solid var(--dark-border); padding-bottom: .5rem;">Requirements</h4>
                <p th:text="${job.requirements}" style="line-height: 1.7; color: var(--dark-text);">—</p>
            </div>

            <div class="actions">
                <!-- Edit Button (Requires 'edit' access on 'job_postings') -->
                <a th:if="${@permissionChecker.hasAccess(isSuperAdmin, 'recruitment', 'job_postings', 'edit')}"
                   th:href="@{/dashboard/hr/job-form(id=${job.id})}" class="btn-custom btn-edit">
                    <i class="fas fa-edit me-2"></i> Edit Job
                </a>

                <a th:href="@{/dashboard/hr}" class="btn-custom btn-back">
                    <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>

<!-- === SHARED AI PANEL === -->
<div th:replace="~{fragments/layout :: aipanel}"></div>

<!-- === SHARED SCRIPTS === -->
<div th:replace="~{fragments/layout :: common-scripts}"></div>

</body>
</html>
