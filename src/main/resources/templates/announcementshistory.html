<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcements History</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/menti-theme.css}" href="../../static/css/menti-theme.css">
    <link rel="stylesheet" th:href="@{/css/menti-ai.css}" href="../../static/css/menti-ai.css">

    <style>
        .announcements-table-wrapper {
            max-height: 620px;
            overflow-y: auto; overflow-x: auto;
            border-radius: var(--radius-card);
        }
        .announcements-table {
            width: 100%; border-collapse: collapse;
            font-size: .82rem; min-width: 760px;
        }
        .announcements-table th {
            background: var(--dark-card);
            padding: .85rem 1rem; text-align: left;
            font-weight: 600; font-size: .75rem;
            color: var(--dark-text-secondary);
            text-transform: uppercase; letter-spacing: .4px;
            border-bottom: 1px solid var(--dark-border);
            position: sticky; top: 0; z-index: 2;
        }
        .announcements-table td {
            padding: .85rem 1rem;
            border-bottom: 1px solid var(--dark-border);
            vertical-align: middle;
            color: var(--dark-text);
        }
        .announcements-table tbody tr:hover { background: rgba(99,102,241,.08); }

        .badge { padding: .3rem .7rem; border-radius: var(--radius-pill); font-size: .7rem; font-weight: 600; display: inline-block; }
        .badge.bg-primary   { background: rgba(99,102,241,.15); color: var(--primary); }
        .badge.bg-secondary { background: rgba(148,163,184,.15); color: var(--dark-text-secondary); }

        .status-active { background: rgba(16,185,129,.2); color: var(--success); padding: 3px 10px; border-radius: var(--radius-pill); font-size: .7rem; display: inline-block; }
        .status-expired { background: rgba(239,68,68,.2); color: var(--danger); padding: 3px 10px; border-radius: var(--radius-pill); font-size: .7rem; display: inline-block; }

        .priority-high { color: var(--danger); font-weight: 600; }
        .priority-normal { color: var(--warning); }
        .priority-low { color: var(--success); }

        .btn-action {
            width: 30px; height: 30px; border-radius: 6px;
            display: inline-flex; align-items: center; justify-content: center;
            border: none; cursor: pointer; transition: var(--transition);
            font-size: .75rem;
        }
        .btn-edit   { background: rgba(99,102,241,.1); color: var(--primary); border: 1px solid rgba(99,102,241,.2); }
        .btn-delete { background: rgba(239,68,68,.1);  color: var(--danger);  border: 1px solid rgba(239,68,68,.2); }
        .btn-view   { background: rgba(14,165,233,.1); color: var(--info);    border: 1px solid rgba(14,165,233,.2); }
        .btn-edit:hover   { background: var(--primary); color: #fff; }
        .btn-delete:hover { background: var(--danger);  color: #fff; }
        .btn-view:hover   { background: var(--info);    color: #fff; }

        .popup-modal-custom {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: var(--radius-card);
            width: 100%; max-width: 850px;
            max-height: calc(100vh - 30px);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .popup-modal-custom .popup-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--dark-border);
        }
        .popup-modal-custom .popup-header h3 {
            margin: 0; font-size: 1.05rem; font-weight: 600;
            color: var(--dark-text);
            display: flex; align-items: center; gap: .5rem;
        }
        .popup-modal-custom .popup-body {
            padding: 1.25rem;
            overflow-y: auto;
            flex: 1;
        }
        .popup-modal-custom .popup-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--dark-border);
            display: flex; justify-content: flex-end; gap: .65rem;
        }

        .form-group-custom label {
            display: block;
            color: var(--dark-text-secondary);
            font-size: .72rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: .4px;
            margin-bottom: .35rem;
        }
        .form-control-custom, .form-select-custom {
            width: 100%;
            padding: .65rem .85rem;
            background: var(--dark-bg);
            border: 1px solid var(--dark-border);
            color: var(--dark-text);
            border-radius: 8px;
            font-size: .85rem;
            font-family: inherit;
            transition: var(--transition);
        }
        .form-control-custom:focus, .form-select-custom:focus {
            border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,.1); outline: none;
        }
        textarea.form-control-custom { resize: vertical; min-height: 120px; }
    </style>
</head>
<body>

<!-- === SHARED SIDEBAR (announcementshistory active) === -->
<div th:replace="~{fragments/layout :: sidebar('announcementshistory')}"></div>

<div class="main-content">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <div class="content-area">

        <div class="pm-page-head">
            <div>
                <h1 class="pm-page-title">
                    <i class="fas fa-bullhorn"></i>
                    <span>Announcements History</span>
                </h1>
                <div class="pm-page-sub">Manage all company announcements — pin, deactivate, delete</div>
            </div>
            <div class="pm-page-actions">
                <button type="button" class="pm-btn pm-btn-primary" onclick="openAnnouncementCreateModal()">
                    <i class="fas fa-plus"></i> New Announcement
                </button>
            </div>
        </div>

        <div class="content-card">
            <div class="card-header">
                <h5 class="card-title">
                    <i class="fas fa-list"></i> All Announcements
                </h5>
                <div style="display: flex; gap: .5rem; align-items: center;">
                    <span class="badge bg-primary" style="font-size: .7rem; padding: 5px 10px;">Admin View</span>
                    <span id="announcementCount" class="badge bg-secondary" style="font-size: .7rem; padding: 5px 10px;">0</span>
                </div>
            </div>
            <div style="padding: 0;">
                <div class="announcements-table-wrapper">
                    <table class="announcements-table">
                        <thead>
                        <tr>
                            <th style="width: 25%;">Title</th>
                            <th style="width: 12%;">Category</th>
                            <th style="width: 10%;">Priority</th>
                            <th style="width: 12%;">Target</th>
                            <th style="width: 10%;">Expiry</th>
                            <th style="width: 10%;">Status</th>
                            <th style="width: 15%; text-align: right;">Actions</th>
                        </tr>
                        </thead>
                        <tbody id="announcements-tbody">
                        <tr>
                            <td colspan="7" class="text-center py-4" style="color: var(--dark-text-secondary);">
                                <i class="fas fa-spinner fa-spin"></i> Loading announcements...
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Create announcement modal -->
<div id="announcementCreateModal" class="attendance-modal" style="padding: 15px;">
    <div class="popup-modal-custom">
        <div class="popup-header">
            <h3><i class="fas fa-bullhorn" style="color: var(--primary);"></i> Create New Announcement</h3>
            <button type="button" class="close-attendance-modal" onclick="closeAnnouncementCreateModal()">&times;</button>
        </div>

        <div class="popup-body">
            <form id="announcementCreateForm" onsubmit="event.preventDefault(); submitAnnouncementCreateForm();">
                <div style="display: grid; grid-template-columns: 1.2fr .8fr; gap: 1.25rem;">
                    <div style="display: flex; flex-direction: column; gap: 1rem;">
                        <div class="form-group-custom">
                            <label>Announcement Title</label>
                            <input type="text" id="announcementTitle" class="form-control-custom"
                                   placeholder="Enter headline..." required>
                        </div>
                        <div class="form-group-custom" style="flex-grow: 1;">
                            <label>Message Content</label>
                            <textarea id="announcementContent" class="form-control-custom"
                                      placeholder="Write your message here..."
                                      required style="min-height: 160px;"></textarea>
                        </div>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: .75rem;
                                background: rgba(255,255,255,.02); padding: 1rem;
                                border-radius: 8px; border: 1px solid var(--dark-border);">
                        <div class="form-group-custom">
                            <label>Duration Type</label>
                            <select id="announcementType" class="form-select-custom" onchange="toggleAnnouncementExpiryField()">
                                <option value="PERMANENT">Permanent</option>
                                <option value="TEMPORARY">Temporary</option>
                            </select>
                        </div>
                        <div id="expiryContainer" style="display: none;">
                            <div class="form-group-custom">
                                <label>Expires At</label>
                                <input type="datetime-local" id="announcementExpiresAt" class="form-control-custom">
                            </div>
                        </div>
                        <div class="form-group-custom">
                            <label>Category</label>
                            <select id="announcementCategory" class="form-select-custom">
                                <option value="Corporate">Corporate</option>
                                <option value="HR">HR</option>
                                <option value="Maintenance">Maintenance</option>
                                <option value="Event">Event</option>
                                <option value="Policy">Policy</option>
                            </select>
                        </div>
                        <div class="form-group-custom">
                            <label>Priority Level</label>
                            <select id="announcementPriority" class="form-select-custom">
                                <option value="NORMAL">Normal</option>
                                <option value="HIGH">High</option>
                                <option value="URGENT">Urgent</option>
                            </select>
                        </div>
                        <div class="form-group-custom">
                            <label>Target Audience</label>
                            <select id="announcementTargetAudience" class="form-select-custom">
                                <option value="ALL">All Employees</option>
                                <option value="HR_ONLY">HR Staff Only</option>
                            </select>
                        </div>
                        <label style="display: flex; align-items: center; gap: 8px;
                                      color: var(--dark-text); cursor: pointer; font-size: .8rem;">
                            <input type="checkbox" id="announcementPinned" style="width: 15px; height: 15px;">
                            Pin this announcement
                        </label>
                    </div>
                </div>
            </form>
        </div>

        <div class="popup-footer">
            <button class="pm-btn" onclick="closeAnnouncementCreateModal()">Cancel</button>
            <button class="pm-btn pm-btn-primary" onclick="submitAnnouncementCreateForm()">Post Announcement</button>
        </div>
    </div>
</div>

<!-- === SHARED AI PANEL === -->
<div th:replace="~{fragments/layout :: aipanel}"></div>

<!-- === SHARED SCRIPTS === -->
<div th:replace="~{fragments/layout :: common-scripts}"></div>

<!-- === PAGE-SPECIFIC SCRIPTS (unchanged) === -->
<script>
    'use strict';

    document.addEventListener('DOMContentLoaded', function () {
        loadAdminAnnouncements();
        document.getElementById('announcementCreateModal').addEventListener('click', function (e) {
            if (e.target === this) closeAnnouncementCreateModal();
        });
    });

    async function loadAdminAnnouncements() {
        var tbody = document.getElementById('announcements-tbody');
        try {
            var res = await fetch('/api/announcements/admin');
            var result = await res.json();
            if (!result.success) throw new Error(result.error || 'Unable to load');
            var items = result.data || [];
            var countBadge = document.getElementById('announcementCount');
            if (countBadge) countBadge.textContent = items.length;

            if (!items.length) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:2rem; color: var(--dark-text-secondary);">' +
                    '<i class="fas fa-bullhorn" style="font-size:2rem; opacity:.3; display:block; margin-bottom:.5rem;"></i>' +
                    'No announcements yet. Click "New Announcement" to create one.</td></tr>';
                return;
            }

            tbody.innerHTML = items.map(function (item) {
                var created = item.createdAt ? new Date(item.createdAt).toLocaleDateString('en-IN') : '—';
                var expires = item.expiresAt ? new Date(item.expiresAt).toLocaleDateString('en-IN') : 'No Expiry';
                var isActive = item.isActive && (!item.expiresAt || new Date(item.expiresAt) >= new Date());
                var priorityClass = item.priority === 'URGENT' || item.priority === 'HIGH' ? 'priority-high'
                                  : item.priority === 'LOW' ? 'priority-low' : 'priority-normal';
                var pinnedIcon = item.isPinned ? '<i class="fas fa-thumbtack" style="color: var(--warning); margin-right: 6px;"></i>' : '';
                var targetClass = item.targetAudience === 'HR_ONLY' ? 'bg-secondary' : 'bg-primary';
                var targetText = item.targetAudience === 'HR_ONLY' ? 'HR Only' : 'All Employees';

                return '<tr>' +
                    '<td><strong>' + pinnedIcon + escapeHtml(item.title || 'Untitled') + '</strong>' +
                        '<br><small style="color: var(--dark-text-secondary);">' +
                        escapeHtml((item.description || '').substring(0, 60)) +
                        ((item.description || '').length > 60 ? '...' : '') + '</small></td>' +
                    '<td><span class="badge bg-secondary">' + escapeHtml(item.category || 'General') + '</span></td>' +
                    '<td><span class="' + priorityClass + '">' + (item.priority || 'NORMAL') + '</span></td>' +
                    '<td><span class="badge ' + targetClass + '">' + targetText + '</span></td>' +
                    '<td><small>' + expires + '</small></td>' +
                    '<td><span class="' + (isActive ? 'status-active' : 'status-expired') + '">' +
                        (isActive ? 'Active' : 'Expired') + '</span></td>' +
                    '<td style="text-align: right;">' +
                        '<div style="display: flex; gap: 6px; justify-content: flex-end;">' +
                            '<button class="btn-action btn-edit" onclick="toggleAnnouncementPin(' + item.id + ')" title="Pin/Unpin">' +
                                '<i class="fas fa-thumbtack"></i></button>' +
                            (isActive ? '<button class="btn-action btn-view" onclick="deactivateAnnouncement(' + item.id + ')" title="Deactivate">' +
                                '<i class="fas fa-ban"></i></button>' : '') +
                            '<button class="btn-action btn-delete" onclick="deleteAnnouncement(' + item.id + ')" title="Delete">' +
                                '<i class="fas fa-trash"></i></button>' +
                        '</div>' +
                    '</td>' +
                '</tr>';
            }).join('');
        } catch (err) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:2rem; color: var(--danger);">' +
                '<i class="fas fa-exclamation-circle"></i> Failed to load announcements</td></tr>';
        }
    }

    function openAnnouncementCreateModal() {
        var m = document.getElementById('announcementCreateModal');
        m.style.display = 'block';
        document.body.style.overflow = 'hidden';
        document.getElementById('announcementCreateForm').reset();
        document.getElementById('expiryContainer').style.display = 'none';
    }

    function closeAnnouncementCreateModal() {
        document.getElementById('announcementCreateModal').style.display = 'none';
        document.body.style.overflow = 'auto';
    }

    function toggleAnnouncementExpiryField() {
        var type = document.getElementById('announcementType');
        var box = document.getElementById('expiryContainer');
        box.style.display = type.value === 'TEMPORARY' ? 'block' : 'none';
        if (type.value !== 'TEMPORARY') document.getElementById('announcementExpiresAt').value = '';
    }

    async function submitAnnouncementCreateForm() {
        var payload = {
            title: document.getElementById('announcementTitle').value.trim(),
            description: document.getElementById('announcementContent').value.trim(),
            type: document.getElementById('announcementType').value,
            category: document.getElementById('announcementCategory').value,
            priority: document.getElementById('announcementPriority').value,
            targetAudience: document.getElementById('announcementTargetAudience').value,
            isPinned: document.getElementById('announcementPinned').checked,
            isActive: true,
            expiresAt: document.getElementById('announcementExpiresAt').value || null
        };
        if (!payload.title || !payload.description) { showPmToast('Title and description required', 'error'); return; }
        if (payload.type === 'TEMPORARY' && !payload.expiresAt) { showPmToast('Expiry required for temporary', 'error'); return; }

        try {
            var res = await fetch('/api/announcements/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            var result = await res.json();
            if (!result.success) throw new Error(result.error || 'Failed');
            showPmToast('Announcement posted', 'success');
            closeAnnouncementCreateModal();
            loadAdminAnnouncements();
        } catch (err) {
            showPmToast(err.message, 'error');
        }
    }

    async function toggleAnnouncementPin(id) {
        try {
            await fetch('/api/announcements/' + id + '/toggle-pin', { method: 'PUT' });
            showPmToast('Pin status updated', 'success');
            loadAdminAnnouncements();
        } catch (err) { showPmToast('Unable to toggle pin', 'error'); }
    }

    async function deactivateAnnouncement(id) {
        if (!confirm('Deactivate this announcement?')) return;
        try {
            await fetch('/api/announcements/' + id + '/deactivate', { method: 'PATCH' });
            showPmToast('Deactivated', 'success');
            loadAdminAnnouncements();
        } catch (err) { showPmToast('Unable to deactivate', 'error'); }
    }

    async function deleteAnnouncement(id) {
        if (!confirm('Delete permanently?')) return;
        try {
            await fetch('/api/announcements/' + id, { method: 'DELETE' });
            showPmToast('Deleted', 'success');
            loadAdminAnnouncements();
        } catch (err) { showPmToast('Unable to delete', 'error'); }
    }

    function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
</script>
</body>
</html>
