<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roles - Menti's IT Solutions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/menti-theme.css}" href="../../static/css/menti-theme.css">
    <link rel="stylesheet" th:href="@{/css/menti-ai.css}" href="../../static/css/menti-ai.css">

    <style>
        .role-id-cell {
            color: var(--dark-text-secondary);
            font-weight: 600;
            font-size: .875rem;
        }
        .role-name-cell {
            display: flex; align-items: center; gap: .75rem;
            font-weight: 600; color: var(--dark-text); font-size: .9rem;
        }
        .role-name-cell i { color: var(--primary); font-size: 1rem; }

        .role-dept-pill {
            display: inline-flex;
            padding: .3rem .75rem;
            background: rgba(99,102,241,.1);
            border: 1px solid rgba(99,102,241,.25);
            border-radius: var(--radius-pill);
            color: #a5b4fc;
            font-size: .78rem;
            font-weight: 500;
        }

        .stats-badge {
            background: rgba(99,102,241,.15);
            border: 1px solid rgba(99,102,241,.25);
            color: var(--primary);
            padding: .25rem .7rem;
            border-radius: var(--radius-pill);
            font-size: .72rem;
            font-weight: 600;
            margin-left: .5rem;
        }
    </style>
</head>
<body>

<!-- === SHARED SIDEBAR (roles active) === -->
<div th:replace="~{fragments/layout :: sidebar('roles')}"></div>

<div class="main-content">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <div class="content-area">

        <div class="pm-page-head">
            <div>
                <h1 class="pm-page-title">
                    <i class="fas fa-user-tag"></i>
                    <span>Roles (Designations)</span>
                    <span class="stats-badge" id="totalCount">0 total</span>
                </h1>
                <div class="pm-page-sub">All designations grouped by department</div>
            </div>
        </div>

        <div class="content-card">
            <div class="card-header">
                <h5 class="card-title"><i class="fas fa-list"></i> All Roles</h5>
                <div class="search-box" style="width: 280px;">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search roles..." onkeyup="filterTable()">
                </div>
            </div>

            <div class="table-container">
                <table class="pm-table" id="rolesTable">
                    <thead>
                    <tr>
                        <th style="width: 15%;"><i class="fas fa-hashtag"></i> Role ID</th>
                        <th style="width: 45%;"><i class="fas fa-tag"></i> Role Name</th>
                        <th style="width: 40%;"><i class="fas fa-building"></i> Department</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody">
                    <tr th:each="desig : ${designations}" class="data-row">
                        <td class="role-id-cell" th:text="'#' + ${desig.id}">#101</td>
                        <td>
                            <div class="role-name-cell">
                                <i class="fas fa-id-badge"></i>
                                <span th:text="${desig.name}">Senior Frontend Developer</span>
                            </div>
                        </td>
                        <td>
                            <span class="role-dept-pill"
                                  th:text="${desig.department != null ? desig.department.name : 'Unassigned'}">Engineering</span>
                        </td>
                    </tr>
                    <tr th:if="${designations == null or designations.empty}" class="empty-state-row">
                        <td colspan="3" style="text-align:center; padding:2rem; color:var(--dark-text-secondary);">
                            <i class="fas fa-user-times" style="font-size:2rem; opacity:.35; display:block; margin-bottom:.5rem;"></i>
                            No roles generated yet. Please create a Designation first.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center;
                        padding:1rem 1.25rem; border-top:1px solid var(--dark-border);
                        gap:1rem; flex-wrap:wrap;">
                <div id="paginationInfo" style="color:var(--dark-text-secondary); font-size:.875rem;">Showing 0 entries</div>
                <nav>
                    <ul id="pagination" style="display:flex; gap:.25rem; list-style:none; margin:0; padding:0;"></ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- === SHARED AI PANEL === -->
<div th:replace="~{fragments/layout :: aipanel}"></div>

<!-- === SHARED SCRIPTS === -->
<div th:replace="~{fragments/layout :: common-scripts}"></div>

<!-- === PAGE-SPECIFIC SCRIPTS (unchanged) === -->
<script>
    'use strict';

    let currentPage = 1;
    const rowsPerPage = 10;
    let allRows = [];
    let filteredRows = [];

    document.addEventListener('DOMContentLoaded', function () {
        var tbody = document.getElementById('tableBody');
        if (tbody) {
            allRows = Array.prototype.slice.call(tbody.querySelectorAll('tr.data-row'));
            filteredRows = allRows.slice();
            updateTotalCount();
            if (allRows.length) renderPagination();
            else document.getElementById('pagination').parentElement.parentElement.style.display = 'none';
        }
    });

    function renderPagination() {
        const totalItems = filteredRows.length;
        const totalPages = Math.max(1, Math.ceil(totalItems / rowsPerPage));

        if (currentPage < 1) currentPage = 1;
        if (currentPage > totalPages) currentPage = totalPages;

        allRows.forEach(function (r) { r.style.display = 'none'; });
        var start = (currentPage - 1) * rowsPerPage;
        var end = Math.min(start + rowsPerPage, totalItems);
        for (var i = start; i < end; i++) filteredRows[i].style.display = '';

        var info = document.getElementById('paginationInfo');
        if (info) info.textContent = totalItems === 0
            ? 'Showing 0 entries'
            : 'Showing ' + (start + 1) + '-' + end + ' of ' + totalItems + ' entries';

        var pagination = document.getElementById('pagination');
        if (!pagination) return;
        pagination.innerHTML = '';

        pagination.appendChild(makeBtn('chev-left', currentPage === 1, function () { currentPage--; renderPagination(); }));
        for (var p = 1; p <= totalPages; p++) {
            (function (pageNum) {
                pagination.appendChild(makeBtn(String(pageNum), false, function () {
                    currentPage = pageNum; renderPagination();
                }, pageNum === currentPage));
            })(p);
        }
        pagination.appendChild(makeBtn('chev-right', currentPage === totalPages, function () { currentPage++; renderPagination(); }));
    }

    function makeBtn(label, disabled, onClick, active) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#';
        a.innerHTML = label.startsWith('chev') ?
            '<i class="fas fa-' + label + '"></i>' : label;
        a.style.cssText = 'display:inline-flex; align-items:center; justify-content:center; ' +
            'min-width:32px; height:32px; border-radius:6px; ' +
            'background:' + (active ? 'var(--primary)' : 'var(--dark-bg)') + '; ' +
            'color:' + (active ? '#fff' : 'var(--dark-text-secondary)') + '; ' +
            'border:1px solid ' + (active ? 'var(--primary)' : 'var(--dark-border)') + '; ' +
            'font-size:.8rem; text-decoration:none; ' +
            'opacity:' + (disabled ? '.4' : '1') + '; ' +
            'pointer-events:' + (disabled ? 'none' : 'auto') + ';';
        a.addEventListener('click', function (ev) { ev.preventDefault(); if (!disabled) onClick(); });
        li.appendChild(a);
        return li;
    }

    function filterTable() {
        var filter = document.getElementById('searchInput').value.toLowerCase().trim();
        filteredRows = allRows.filter(function (row) {
            var roleId = row.cells[0].textContent.toLowerCase();
            var roleName = (row.cells[1].querySelector('span') || {}).textContent?.toLowerCase() || '';
            var dept = row.cells[2].textContent.toLowerCase();
            return roleId.includes(filter) || roleName.includes(filter) || dept.includes(filter);
        });
        currentPage = 1;
        updateTotalCount();
        renderPagination();
    }

    function updateTotalCount() {
        var el = document.getElementById('totalCount');
        if (el) el.textContent = filteredRows.length + ' total';
    }
</script>
</body>
</html>
