<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locations - Menti's IT Solutions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/menti-theme.css}" href="../../static/css/menti-theme.css">
    <link rel="stylesheet" th:href="@{/css/menti-ai.css}" href="../../static/css/menti-ai.css">

    <style>
        .org-cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.25rem;
        }
        .org-card {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: var(--radius-card);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
        }
        .org-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--primary);
        }
        .org-card-header {
            padding: 1.1rem 1.25rem;
            border-bottom: 1px solid var(--dark-border);
            display: flex; justify-content: space-between; align-items: flex-start;
            background: rgba(255,255,255,.02);
            gap: .75rem;
        }
        .org-card-title {
            font-size: 1.05rem; font-weight: 600;
            color: var(--dark-text);
            display: flex; align-items: center; gap: .5rem;
            margin: 0;
        }
        .org-card-title i { color: var(--primary); }
        .org-card-body { padding: 1rem 1.25rem; }
        .org-card-detail {
            display: flex; align-items: center; gap: .5rem;
            margin-bottom: .45rem;
            color: var(--dark-text-secondary);
            font-size: .85rem;
        }
        .org-card-detail:last-child { margin-bottom: 0; }
        .org-card-detail i { color: var(--primary); width: 16px; text-align: center; }
        .org-card-detail span { color: var(--dark-text); font-weight: 500; }
        .org-card-footer {
            padding: .8rem 1.25rem;
            border-top: 1px solid var(--dark-border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(0,0,0,.15);
        }
        .org-card-badge {
            padding: .25rem .7rem;
            border-radius: var(--radius-pill);
            font-size: .72rem; font-weight: 600;
        }
        .badge-primary   { background: rgba(99,102,241,.15); color: var(--primary); }
        .badge-employees { background: rgba(16,185,129,.15); color: var(--success); }

        .org-profile-container {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: var(--radius-card);
            overflow: hidden;
            max-width: 900px; margin: 0 auto;
        }
        .org-profile-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--dark-border);
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(135deg, rgba(99,102,241,.1), rgba(99,102,241,.03));
            flex-wrap: wrap; gap: .75rem;
        }
        .org-profile-title {
            font-size: 1.15rem; font-weight: 600;
            color: var(--dark-text);
            display: flex; align-items: center; gap: .5rem;
            margin: 0;
        }
        .org-profile-body { padding: 1.5rem; }
        .org-details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.25rem;
        }
        .org-detail-label {
            color: var(--dark-text-secondary);
            font-size: .72rem;
            text-transform: uppercase;
            letter-spacing: .5px;
            display: block; margin-bottom: .2rem;
        }
        .org-detail-value {
            color: var(--dark-text);
            font-size: .95rem; font-weight: 500;
        }

        .form-label {
            color: var(--dark-text); font-weight: 500;
            margin-bottom: .4rem; display: block;
        }
        .form-control, .form-select {
            background: var(--dark-bg);
            border: 1px solid var(--dark-border);
            color: var(--dark-text);
            border-radius: 8px;
            padding: .65rem .75rem;
            width: 100%;
            transition: var(--transition);
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,.1);
            outline: none;
        }
    </style>
</head>
<body>

<!-- === SHARED SIDEBAR (locations active) === -->
<div th:replace="~{fragments/layout :: sidebar('locations')}"></div>

<div class="main-content">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <div class="content-area">

        <div class="pm-page-head">
            <div>
                <h1 class="pm-page-title">
                    <i class="fas fa-map-marker-alt"></i>
                    <span>Office Locations</span>
                </h1>
                <div class="pm-page-sub">Manage company office locations</div>
            </div>
            <div class="pm-page-actions">
                <button class="pm-btn pm-btn-primary" onclick="createNewLocation()">
                    <i class="fas fa-plus"></i> Add Location
                </button>
            </div>
        </div>

        <div class="stats-grid" style="margin-bottom: 1.25rem;">
            <div class="stat-card" onclick="filterLocationsByType('all')" id="card-all">
                <div class="stat-card-body">
                    <div>
                        <div class="stat-value" id="totalLocations">0</div>
                        <div class="stat-title">Total Locations</div>
                    </div>
                    <div class="stat-icon blue"><i class="fas fa-map-marker-alt"></i></div>
                </div>
            </div>
            <div class="stat-card" onclick="filterLocationsByType('countries')" id="card-countries">
                <div class="stat-card-body">
                    <div>
                        <div class="stat-value" id="totalCountries">0</div>
                        <div class="stat-title">Countries</div>
                    </div>
                    <div class="stat-icon cyan"><i class="fas fa-globe-americas"></i></div>
                </div>
            </div>
            <div class="stat-card" onclick="filterLocationsByType('employees')" id="card-employees">
                <div class="stat-card-body">
                    <div>
                        <div class="stat-value" id="totalEmployees">0</div>
                        <div class="stat-title">Total Employees</div>
                    </div>
                    <div class="stat-icon green"><i class="fas fa-users"></i></div>
                </div>
            </div>
            <div class="stat-card" onclick="refreshLocations()" id="card-refresh">
                <div class="stat-card-body">
                    <div>
                        <div class="stat-value" id="lastUpdated">Just now</div>
                        <div class="stat-title">Last Updated</div>
                    </div>
                    <div class="stat-icon purple"><i class="fas fa-sync-alt"></i></div>
                </div>
            </div>
        </div>

        <div id="orgCardsView">
            <div class="org-cards-container" id="orgCardsContainer"></div>
        </div>

        <div id="organizationContent" style="display: none;">
            <div class="org-profile-container">
                <div class="org-profile-header">
                    <h2 class="org-profile-title">
                        <i class="fas fa-map-marker-alt" style="color: var(--primary);"></i>
                        <span id="orgProfileTitleText">Location Details</span>
                    </h2>
                    <div id="orgProfileActions" style="display:flex; gap:.5rem;"></div>
                </div>
                <div class="org-profile-body" id="orgProfileBody"></div>
            </div>
        </div>
    </div>
</div>

<div class="attendance-modal" id="deleteConfirmationModal">
    <div class="attendance-modal-content" style="max-width: 480px;">
        <div class="attendance-modal-header">
            <h3 style="color: var(--danger);"><i class="fas fa-exclamation-triangle"></i> Delete Location</h3>
            <button class="close-attendance-modal" onclick="closeModal()">&times;</button>
        </div>
        <p style="color: var(--dark-text); padding: .5rem 0 1rem;">
            Are you sure you want to delete this location? This action cannot be undone.
        </p>
        <div style="display:flex; gap:.75rem; justify-content:flex-end;">
            <button class="pm-btn" onclick="closeModal()">Cancel</button>
            <button class="pm-btn pm-btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
    </div>
</div>

<!-- === SHARED AI PANEL === -->
<div th:replace="~{fragments/layout :: aipanel}"></div>

<!-- === SHARED SCRIPTS === -->
<div th:replace="~{fragments/layout :: common-scripts}"></div>

<!-- === PAGE-SPECIFIC SCRIPTS (unchanged) === -->
<script>
    'use strict';

    let locations = [];
    let currentLocationId = null;

    document.addEventListener('DOMContentLoaded', function () {
        loadLocations();
        var search = document.getElementById('searchInput');
        if (search) search.addEventListener('input', function (e) {
            filterLocations(e.target.value.toLowerCase());
        });
        document.getElementById('confirmDeleteBtn').onclick = deleteLocation;
    });

    async function loadLocations() {
        try {
            var res = await fetch('/api/locations/all');
            var data = await res.json();
            if (data.success) {
                locations = data.locations || [];
                renderLocationCards();
                updateStats();
            } else {
                showPmToast(data.error || 'Failed to load', 'error');
            }
        } catch (err) {
            showPmToast('Failed to load locations', 'error');
        }
    }

    async function saveLocation(locationData) {
        try {
            var url = locationData.id
                ? '/api/locations/update/' + locationData.id
                : '/api/locations/create';
            var method = locationData.id ? 'PUT' : 'POST';
            var res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(locationData)
            });
            var data = await res.json();
            if (data.success) {
                showPmToast(data.message, 'success');
                await loadLocations();
                return true;
            }
            showPmToast(data.error || 'Operation failed', 'error');
            return false;
        } catch (err) {
            showPmToast('Failed to save location', 'error');
            return false;
        }
    }

    async function deleteLocation() {
        if (!currentLocationId) return;
        try {
            var res = await fetch('/api/locations/delete/' + currentLocationId, { method: 'DELETE' });
            var data = await res.json();
            if (data.success) {
                showPmToast('Location deleted', 'success');
                closeModal();
                await loadLocations();
                showCardsView();
            } else {
                showPmToast(data.error || 'Failed to delete', 'error');
            }
        } catch (err) {
            showPmToast('Failed to delete location', 'error');
        }
    }

    function renderLocationCards() {
        var box = document.getElementById('orgCardsContainer');
        if (!locations.length) {
            box.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;">' +
                '<i class="fas fa-map-marker-alt"></i>' +
                '<h4>No Locations Found</h4>' +
                '<p>Click "Add Location" to create your first office.</p>' +
            '</div>';
            return;
        }
        box.innerHTML = locations.map(function (loc) { return createCardHtml(loc); }).join('');
    }

    function createCardHtml(loc) {
        var employeeCount = loc.employees || 0;
        return '<div class="org-card" onclick="viewLocation(\'' + escapeHtml(String(loc.id)) + '\')">' +
            '<div class="org-card-header">' +
                '<h5 class="org-card-title"><i class="fas fa-building"></i>' + escapeHtml(loc.name) + '</h5>' +
                '<div onclick="event.stopPropagation()" style="display:flex;gap:.35rem;">' +
                    '<button class="btn-action btn-edit" onclick="editLocation(\'' + escapeHtml(String(loc.id)) + '\')" title="Edit"><i class="fas fa-edit"></i></button>' +
                    '<button class="btn-action btn-delete" onclick="showDeleteConfirmation(\'' + escapeHtml(String(loc.id)) + '\')" title="Delete"><i class="fas fa-trash"></i></button>' +
                '</div>' +
            '</div>' +
            '<div class="org-card-body">' +
                '<div class="org-card-detail"><i class="fas fa-map-marker-alt"></i><span>' + escapeHtml(loc.city) + ', ' + escapeHtml(loc.country) + '</span></div>' +
                '<div class="org-card-detail"><i class="fas fa-phone"></i><span>' + escapeHtml(loc.phone) + '</span></div>' +
                '<div class="org-card-detail"><i class="fas fa-envelope"></i><span>' + escapeHtml(loc.email) + '</span></div>' +
            '</div>' +
            '<div class="org-card-footer">' +
                '<span class="org-card-badge badge-primary">' + escapeHtml(loc.locationType || 'Office') + '</span>' +
                '<span class="org-card-badge badge-employees"><i class="fas fa-users"></i> ' + employeeCount + '</span>' +
            '</div>' +
        '</div>';
    }

    function filterLocations(term) {
        if (!term) { renderLocationCards(); return; }
        var filtered = locations.filter(function (l) {
            return (l.name || '').toLowerCase().includes(term) ||
                   (l.city || '').toLowerCase().includes(term) ||
                   (l.country || '').toLowerCase().includes(term);
        });
        if (!filtered.length) {
            document.getElementById('orgCardsContainer').innerHTML =
                '<div class="empty-state" style="grid-column: 1 / -1;">' +
                '<i class="fas fa-search"></i><h4>No matching locations</h4></div>';
        } else {
            document.getElementById('orgCardsContainer').innerHTML = filtered.map(createCardHtml).join('');
        }
    }

    function updateStats() {
        document.getElementById('totalLocations').textContent = locations.length;
        document.getElementById('totalCountries').textContent = new Set(locations.map(function (l) { return l.country; })).size;
        document.getElementById('totalEmployees').textContent = locations.reduce(function (s, l) { return s + (l.employees || 0); }, 0);
        document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function showCardsView() {
        document.getElementById('orgCardsView').style.display = 'block';
        document.getElementById('organizationContent').style.display = 'none';
        renderLocationCards();
    }

    function createNewLocation() {
        currentLocationId = null;
        document.getElementById('orgCardsView').style.display = 'none';
        document.getElementById('organizationContent').style.display = 'block';
        renderForm();
    }

    function viewLocation(id) {
        currentLocationId = String(id);
        document.getElementById('orgCardsView').style.display = 'none';
        document.getElementById('organizationContent').style.display = 'block';
        renderProfile();
    }

    function editLocation(id) {
        currentLocationId = String(id);
        document.getElementById('orgCardsView').style.display = 'none';
        document.getElementById('organizationContent').style.display = 'block';
        renderForm();
    }

    function getCurrentLocation() {
        return locations.find(function (l) { return String(l.id) === String(currentLocationId); });
    }

    function renderProfile() {
        var loc = getCurrentLocation();
        if (!loc) { showCardsView(); return; }
        document.getElementById('orgProfileTitleText').textContent = loc.name;
        document.getElementById('orgProfileActions').innerHTML =
            '<button class="pm-btn" onclick="showCardsView()"><i class="fas fa-arrow-left"></i> Back</button>' +
            '<button class="pm-btn pm-btn-primary" onclick="editLocation(\'' + escapeHtml(String(loc.id)) + '\')"><i class="fas fa-edit"></i> Edit</button>' +
            '<button class="pm-btn pm-btn-danger" onclick="showDeleteConfirmation(\'' + escapeHtml(String(loc.id)) + '\')"><i class="fas fa-trash"></i> Delete</button>';

        document.getElementById('orgProfileBody').innerHTML =
            '<div class="org-details-grid">' +
                detail('Location Name', loc.name) +
                detail('Type', loc.locationType || 'Office') +
                detail('Phone', loc.phone) +
                detail('Email', loc.email) +
                detail('Address', loc.address) +
                detail('Country', loc.country) +
                detail('State', loc.state) +
                detail('City', loc.city) +
                detail('Zip Code', loc.zipCode || 'N/A') +
                detail('Employees', loc.employees || 0) +
            '</div>';
    }

    function detail(label, value) {
        return '<div class="org-detail-group">' +
            '<span class="org-detail-label">' + escapeHtml(label) + '</span>' +
            '<span class="org-detail-value">' + escapeHtml(String(value == null ? '' : value)) + '</span>' +
        '</div>';
    }

    function renderForm() {
        var loc = getCurrentLocation();
        var isEdit = !!loc;
        document.getElementById('orgProfileTitleText').textContent = isEdit ? 'Edit Location' : 'Add New Location';
        document.getElementById('orgProfileActions').innerHTML =
            '<button class="pm-btn" onclick="showCardsView()"><i class="fas fa-times"></i> Cancel</button>' +
            '<button class="pm-btn pm-btn-primary" onclick="document.getElementById(\'locationForm\').dispatchEvent(new Event(\'submit\'))"><i class="fas fa-save"></i> Save</button>';

        document.getElementById('orgProfileBody').innerHTML =
            '<form id="locationForm">' +
                '<input type="hidden" id="locationId" value="' + (isEdit ? escapeHtml(String(loc.id)) : '') + '">' +
                '<div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">' +
                    field('Location Name *', 'text', 'name', isEdit ? loc.name : '') +
                    field('Type *', 'select', 'locationType', isEdit ? loc.locationType : '', ['Headquarters', 'Regional Office', 'Local Office', 'International Office', 'Branch Office']) +
                    field('Country *', 'text', 'country', isEdit ? loc.country : '') +
                    field('State *', 'text', 'state', isEdit ? loc.state : '') +
                    field('City *', 'text', 'city', isEdit ? loc.city : '') +
                    field('Zip Code', 'text', 'zipCode', isEdit ? (loc.zipCode || '') : '') +
                '</div>' +
                '<div style="margin-top:1rem;">' +
                    '<label class="form-label">Address *</label>' +
                    '<input type="text" id="address" class="form-control" value="' + escapeHtml(isEdit ? loc.address : '') + '">' +
                '</div>' +
                '<div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-top:1rem;">' +
                    field('Phone *', 'tel', 'phone', isEdit ? loc.phone : '') +
                    field('Email *', 'email', 'email', isEdit ? loc.email : '') +
                '</div>' +
                '<div style="margin-top:1rem;">' +
                    '<label class="form-label">Employee Count</label>' +
                    '<input type="number" id="employees" class="form-control" value="' + (isEdit ? (loc.employees || 0) : 0) + '" min="0">' +
                '</div>' +
                '<div style="display:flex; justify-content:flex-end; gap:.75rem; margin-top:1.5rem;">' +
                    '<button type="button" class="pm-btn" onclick="showCardsView()">Cancel</button>' +
                    '<button type="submit" class="pm-btn pm-btn-primary"><i class="fas fa-save"></i> ' + (isEdit ? 'Save Changes' : 'Create') + '</button>' +
                '</div>' +
            '</form>';

        document.getElementById('locationForm').addEventListener('submit', handleFormSubmit);
    }

    function field(label, type, id, value, options) {
        if (type === 'select') {
            var opts = '<option value="">Select</option>' + options.map(function (o) {
                return '<option value="' + o + '"' + (o === value ? ' selected' : '') + '>' + o + '</option>';
            }).join('');
            return '<div><label class="form-label">' + label + '</label>' +
                '<select id="' + id + '" class="form-select">' + opts + '</select></div>';
        }
        return '<div><label class="form-label">' + label + '</label>' +
            '<input type="' + type + '" id="' + id + '" class="form-control" value="' + escapeHtml(String(value || '')) + '"></div>';
    }

    async function handleFormSubmit(e) {
        e.preventDefault();
        var id = document.getElementById('locationId').value;
        var data = {
            name: document.getElementById('name').value.trim(),
            locationType: document.getElementById('locationType').value,
            country: document.getElementById('country').value.trim(),
            state: document.getElementById('state').value.trim(),
            city: document.getElementById('city').value.trim(),
            zipCode: document.getElementById('zipCode').value.trim(),
            address: document.getElementById('address').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            email: document.getElementById('email').value.trim(),
            employees: parseInt(document.getElementById('employees').value, 10) || 0
        };
        if (id) data.id = id;
        if (!data.name || !data.country || !data.city) {
            showPmToast('Name, Country, and City are required', 'error');
            return;
        }
        var ok = await saveLocation(data);
        if (ok) { if (id) renderProfile(); else showCardsView(); }
    }

    function showDeleteConfirmation(id) {
        currentLocationId = String(id);
        document.getElementById('deleteConfirmationModal').style.display = 'block';
    }

    function closeModal() {
        document.getElementById('deleteConfirmationModal').style.display = 'none';
    }

    function filterLocationsByType(type) {
        document.querySelectorAll('.stat-card').forEach(function (c) { c.classList.remove('active'); });
        var el = document.getElementById('card-' + type);
        if (el) el.classList.add('active');
        if (type === 'all') renderLocationCards();
        else if (type === 'countries') {
            var sorted = locations.slice().sort(function (a, b) { return (a.country || '').localeCompare(b.country || ''); });
            document.getElementById('orgCardsContainer').innerHTML = sorted.map(createCardHtml).join('');
        } else if (type === 'employees') {
            var sorted2 = locations.slice().sort(function (a, b) { return (b.employees || 0) - (a.employees || 0); });
            document.getElementById('orgCardsContainer').innerHTML = sorted2.map(createCardHtml).join('');
        }
    }

    function refreshLocations() {
        var el = document.getElementById('card-refresh');
        if (el) { el.classList.add('active'); setTimeout(function () { el.classList.remove('active'); }, 300); }
        loadLocations();
        showPmToast('Locations refreshed', 'success');
    }

    function escapeHtml(s) {
        if (s == null) return '';
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
</script>
</body>
</html>
