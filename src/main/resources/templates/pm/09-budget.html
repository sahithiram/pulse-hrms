<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta name="current-user-id" th:content="${session.userId ?: 'anonymous'}">
    <title>Project Management · Budget</title>

    <!-- Shared CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Theme -->
    <link rel="stylesheet" th:href="@{/css/menti-theme.css}" href="../../static/css/menti-theme.css">
    <link rel="stylesheet" th:href="@{/css/menti-ai.css}" href="../../static/css/menti-ai.css">
    <link rel="stylesheet" th:href="@{/pm/pm-ui.css}" href="../../static/pm/pm-ui.css">

    <style>
        .budget-summary {

          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
          gap: 1rem;
          margin-bottom: 1.5rem;
        }
        .budget-card {
          background: var(--dark-card);
          border: 1px solid var(--dark-border);
          border-radius: 12px;
          padding: 1.15rem 1.25rem;
          text-align: center;
        }
        .budget-card .label {
          font-size: .8rem;
          color: var(--dark-text-secondary);
          margin-bottom: .35rem;
        }
        .budget-card .value {
          font-size: 1.4rem;
          font-weight: 700;
        }
        .budget-card .value.spent { color: var(--warning); }
        .budget-card .value.remain { color: var(--success); }
        .budget-card .value.risk { color: var(--danger); }

        .budget-toolbar {
          display: flex;
          gap: .5rem;
          flex-wrap: wrap;
          align-items: center;
          margin-bottom: 1rem;
          background: var(--dark-card);
          border: 1px solid var(--dark-border);
          border-radius: 10px;
          padding: .55rem .75rem;
        }
        .budget-toolbar input,
        .budget-toolbar select {
          height: 34px;
          border-radius: 8px;
          font-size: .85rem;
        }
    </style>
</head>
<body>

<!-- Include the same sidebar as other PM pages -->
<div th:replace="~{pm/fragments/sidebar :: sidebar}"></div>

<!-- If you don't have a fragments/sidebar, copy the sidebar HTML from 04-projects.html -->

<main class="pm-main">
    <div class="pm-page" style="padding: 1.25rem 1.5rem 2.5rem;">

        <!-- Breadcrumb -->
        <div class="pm-breadcrumb" style="margin-bottom: .75rem; font-size: .8125rem; color: var(--dark-text-secondary);">
            <a href="/pm/01-home">Home</a>
            <i class="fas fa-chevron-right" style="font-size: .65rem; margin: 0 4px;"></i>
            <span style="font-weight: 600;">Budget</span>
        </div>

        <!-- Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .75rem; margin-bottom: 1.25rem;">
            <div>
                <h1 style="font-size: 1.4rem; font-weight: 700; margin: 0; display: flex; align-items: center; gap: .5rem;">
                    <i class="fas fa-wallet" style="color: var(--primary);"></i> Budget Overview
                </h1>
                <div style="font-size: .85rem; color: var(--dark-text-secondary); margin-top: 2px;">
                    Track budget vs actual across all projects
                </div>
            </div>
            <div style="display: flex; gap: .5rem;">
                <button class="pm-btn" onclick="window.location.reload()">
                    <i class="fas fa-sync"></i> Refresh
                </button>
                <button class="pm-btn pm-btn-primary" onclick="exportBudget()">
                    <i class="fas fa-download"></i> Export
                </button>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="budget-summary">
            <div class="budget-card">
                <div class="label">Total Budget</div>
                <div class="value" id="sumBudget">₹0</div>
            </div>
            <div class="budget-card">
                <div class="label">Total Spent</div>
                <div class="value spent" id="sumSpent">₹0</div>
            </div>
            <div class="budget-card">
                <div class="label">Remaining</div>
                <div class="value remain" id="sumRemain">₹0</div>
            </div>
            <div class="budget-card">
                <div class="label">Projects At Risk</div>
                <div class="value risk" id="sumRisk">0</div>
            </div>
        </div>

        <!-- Toolbar -->
        <div class="budget-toolbar">
            <div style="position: relative; flex: 1; min-width: 200px; max-width: 280px;">
                <i class="fas fa-search" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--dark-text-secondary); font-size: .8rem;"></i>
                <input type="text" id="budgetSearch" class="cp-in" placeholder="Search projects..."
                       style="padding-left: 32px; width: 100%;" oninput="filterBudget()">
            </div>
            <select id="budgetStatus" class="cp-in" style="max-width: 150px;" onchange="filterBudget()">
                <option value="">All Status</option>
                <option value="on-track">On Track</option>
                <option value="at-risk">At Risk</option>
                <option value="over">Over Budget</option>
            </select>
        </div>

        <!-- Table -->
        <div class="pm-card" style="padding: 0; overflow: hidden;">
            <div class="table-responsive">
                <table class="pm-table" style="margin: 0;">
                    <thead>
                    <tr>
                        <th style="padding-left: 1.1rem;">Project</th>
                        <th>Budget</th>
                        <th>Spent</th>
                        <th>Remaining</th>
                        <th>% Used</th>
                        <th>Status</th>
                        <th style="width: 90px;"></th>
                    </tr>
                    </thead>
                    <tbody id="budgetBody">
                    <tr>
                        <td colspan="7" style="text-align: center; padding: 2.5rem; color: var(--dark-text-secondary);">
                            <i class="fas fa-spinner fa-spin"></i> Loading budget data...
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</main>

<script th:src="@{/pm/pm-core.js}" src="../../static/pm/pm-core.js"></script>
<script th:src="@{/pm/pm-finance.js}" src="../../static/pm/pm-finance.js"></script>

<script>
    // Simple budget list loader
    function loadBudget() {
      // You can later replace this with real API: PM.api('GET', '/api/pm/budget/overview')
      // For now it shows a clean empty state so the page works
      const body = document.getElementById('budgetBody');
      body.innerHTML = `
        <tr>
          <td colspan="7" style="text-align:center;padding:3rem;color:var(--dark-text-secondary);">
            <i class="fas fa-wallet" style="font-size:1.8rem;opacity:.4;display:block;margin-bottom:.6rem;"></i>
            No budget data yet.<br>
            <small>Budgets will appear here once projects have budget values.</small>
          </td>
        </tr>`;
    }

    function filterBudget() {
      // Placeholder – will work once real data is loaded
    }

    function exportBudget() {
      PM.toast('Export coming soon', 'info');
    }

    document.addEventListener('DOMContentLoaded', loadBudget);
</script>

</body>
</html>
