<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>PM · Dependency Graph</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{color-scheme:dark;--bg:#0f172a;--bg2:#131c31;--card:#1e293b;--card2:#243347;--bd:#2a3950;--bd2:#3b4d6a;--tx:#f1f5f9;--tx2:#94a3b8;--tx3:#64748b;--pri:#6366f1;--pri-h:#4f46e5;--pri-soft:rgba(99,102,241,.12);--suc:#10b981;--suc-soft:rgba(16,185,129,.14);--dng:#ef4444;--dng-soft:rgba(239,68,68,.14);--wrn:#f59e0b;--wrn-soft:rgba(245,158,11,.14);--inf:#0ea5e9;--inf-soft:rgba(14,165,233,.14);--pur:#a855f7;--pur-soft:rgba(168,85,247,.14);--sb:232px;--sb-c:56px;--hh:46px;--r:6px;--rl:8px;--fs-xs:10.5px;--fs-sm:11.5px;--fs:12.5px;--fs-md:13.5px;--fs-lg:15px;--fs-xl:18px;--t:180ms cubic-bezier(.4,0,.2,1);--t-fast:120ms cubic-bezier(.4,0,.2,1);--sh:0 4px 12px rgba(0,0,0,.35);--sh-lg:0 12px 40px rgba(0,0,0,.5);--z-sb:1000;--z-h:900;--z-dr:1200;--z-ts:1600;--z-cmd:1700}
        .pm-light{color-scheme:light;--bg:#f8fafc;--bg2:#fff;--card:#fff;--card2:#f1f5f9;--bd:#e2e8f0;--bd2:#cbd5e1;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8}
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%}
        body{font-family:'Inter',sans-serif;font-size:var(--fs);line-height:1.45;background:var(--bg);color:var(--tx);overflow-x:hidden;-webkit-font-smoothing:antialiased}
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:6px}
        a{color:var(--pri);text-decoration:none}
        button{font-family:inherit}
        .pm-shell{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh;transition:grid-template-columns var(--t)}
        .pm-shell.collapsed{grid-template-columns:var(--sb-c) 1fr}
        .pm-sidebar{position:sticky;top:0;height:100vh;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column;overflow:hidden;z-index:var(--z-sb)}
        .pm-brand{display:flex;align-items:center;gap:8px;padding:10px 12px;height:var(--hh);border-bottom:1px solid var(--bd);flex-shrink:0}
        .pm-brand-logo{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--pri),var(--pur));display:grid;place-content:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}
        .pm-brand-name{font-weight:600;font-size:var(--fs-md);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
        .pm-shell.collapsed .pm-brand-name,.pm-shell.collapsed .pm-nav-section,.pm-shell.collapsed .pm-nav-label,.pm-shell.collapsed .pm-nav-badge{display:none}
        .pm-sidebar-scroll{flex:1;overflow-y:auto;padding:6px 6px 20px}
        .pm-nav-section{padding:12px 10px 4px;font-size:var(--fs-xs);font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--tx3);display:flex;align-items:center;gap:6px}
        .pm-nav-section i{font-size:9px;color:var(--pri)}
        .pm-nav-link{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r);color:var(--tx2);text-decoration:none;font-size:var(--fs);font-weight:500;transition:background var(--t-fast),color var(--t-fast);cursor:pointer;white-space:nowrap;margin:1px 0}
        .pm-nav-link:hover{background:var(--card2);color:var(--tx)}
        .pm-nav-link.active{background:var(--pri-soft);color:var(--pri)}
        .pm-nav-link i{width:16px;text-align:center;font-size:12.5px;flex-shrink:0}
        .pm-nav-label{flex:1;overflow:hidden;text-overflow:ellipsis}
        .pm-nav-badge{background:var(--pri);color:#fff;font-size:var(--fs-xs);font-weight:700;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
        .pm-main{min-width:0;display:flex;flex-direction:column}
        .pm-header{position:sticky;top:0;z-index:var(--z-h);height:var(--hh);background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:0 10px;flex-shrink:0}
        .pm-iconbtn{width:30px;height:30px;border-radius:var(--r);border:1px solid var(--bd);background:transparent;color:var(--tx2);display:grid;place-content:center;cursor:pointer;font-size:12px;transition:var(--t-fast);position:relative;flex-shrink:0}
        .pm-iconbtn:hover{color:var(--tx);border-color:var(--pri)}
        .pm-search{position:relative;flex:1;max-width:380px}
        .pm-search i{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--tx3)}
        .pm-search input{width:100%;height:30px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);padding:0 10px 0 30px;font-size:var(--fs);font-family:inherit;outline:none}
        .pm-search input:focus{border-color:var(--pri)}
        .pm-search kbd{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:var(--card2);border:1px solid var(--bd);border-radius:4px;padding:1px 5px;font-size:var(--fs-xs);color:var(--tx3)}
        .pm-header-right{display:flex;align-items:center;gap:6px;margin-left:auto}
        .pm-live{display:flex;align-items:center;gap:5px;font-size:var(--fs-xs);color:var(--tx3);font-weight:600;padding:0 6px}
        .pm-live .dot{width:6px;height:6px;border-radius:50%;background:var(--suc);position:relative}
        .pm-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pur));color:#fff;font-weight:700;font-size:11px;display:grid;place-content:center;cursor:pointer;flex-shrink:0}
        .pm-content{padding:12px 14px;flex:1;min-width:0}
        .pm-breadcrumb{font-size:var(--fs-sm);color:var(--tx3);margin-bottom:8px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
        .pm-breadcrumb a{color:var(--tx3)}
        .pm-breadcrumb a:hover{color:var(--pri)}
        .pm-page-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
        .pm-page-title{font-size:var(--fs-xl);font-weight:600;display:flex;align-items:center;gap:8px}
        .pm-page-title i{color:var(--pri);font-size:15px}
        .pm-page-sub{font-size:var(--fs-sm);color:var(--tx2);margin-top:2px}
        .pm-page-actions{display:flex;gap:6px;flex-wrap:wrap}
        .pm-btn{height:28px;padding:0 10px;border-radius:var(--r);border:1px solid var(--bd);background:transparent;color:var(--tx);font-family:inherit;font-size:var(--fs);font-weight:500;display:inline-flex;align-items:center;gap:5px;cursor:pointer;transition:var(--t-fast);white-space:nowrap}
        .pm-btn:hover{border-color:var(--pri);color:var(--pri)}
        .pm-btn i{font-size:11px}
        .pm-btn-primary{background:var(--pri);border-color:var(--pri);color:#fff}
        .pm-btn-primary:hover{background:var(--pri-h);border-color:var(--pri-h);color:#fff}
        .pm-input,.pm-select{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);color:var(--tx);padding:6px 10px;font-family:inherit;font-size:var(--fs);outline:none;width:100%;height:28px}
        .pm-input:focus,.pm-select:focus{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
        .pm-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);padding:10px 12px;margin-bottom:10px}
        .pm-badge{display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:10px;font-size:var(--fs-xs);font-weight:600;white-space:nowrap;line-height:1.6}
        .pm-badge.primary{background:var(--pri-soft);color:var(--pri)}
        .pm-badge.success{background:var(--suc-soft);color:var(--suc)}
        .pm-badge.danger{background:var(--dng-soft);color:var(--dng)}
        .pm-badge.warning{background:var(--wrn-soft);color:var(--wrn)}
        .pm-badge.info{background:var(--inf-soft);color:var(--inf)}
        .pm-badge.purple{background:var(--pur-soft);color:var(--pur)}
        .pm-toasts{position:fixed;top:12px;right:12px;z-index:var(--z-ts);display:flex;flex-direction:column;gap:6px;max-width:340px;pointer-events:none}
        .pm-toast{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--pri);border-radius:var(--rl);padding:8px 10px;display:flex;align-items:center;gap:8px;box-shadow:var(--sh);transform:translateX(120%);transition:transform 280ms cubic-bezier(.4,0,.2,1);pointer-events:auto;cursor:pointer}
        .pm-toast.show{transform:translateX(0)}
        .pm-toast.success{border-left-color:var(--suc)}
        .pm-toast.error{border-left-color:var(--dng)}
        .pm-toast.warning{border-left-color:var(--wrn)}
        .pm-toast-icon{width:22px;height:22px;border-radius:50%;display:grid;place-content:center;color:#fff;font-size:10px;flex-shrink:0}
        .pm-toast.success .pm-toast-icon{background:var(--suc)}
        .pm-toast.error .pm-toast-icon{background:var(--dng)}
        .pm-toast.warning .pm-toast-icon{background:var(--wrn)}
        .pm-toast.info .pm-toast-icon{background:var(--inf)}
        .pm-toast-msg{flex:1;font-size:var(--fs);font-weight:500}
        .pm-drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:var(--z-dr);opacity:0;pointer-events:none;transition:opacity var(--t)}
        .pm-drawer-backdrop.open{opacity:1;pointer-events:auto}
        .pm-drawer{position:fixed;top:0;right:0;width:min(600px,96vw);height:100vh;background:var(--card);border-left:1px solid var(--bd);z-index:calc(var(--z-dr) + 1);transform:translateX(100%);transition:transform 280ms cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:var(--sh-lg)}
        .pm-drawer.open{transform:translateX(0)}
        .pm-drawer-head{height:var(--hh);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 12px;flex-shrink:0}
        .pm-drawer-title{font-size:var(--fs-md);font-weight:600}
        .pm-drawer-body{flex:1;overflow-y:auto;padding:12px}
        .graph-wrap{background:var(--card);border:1px solid var(--bd);border-radius:var(--rl);overflow:auto;position:relative;max-height:calc(100vh - 240px);min-height:600px}
        .graph-svg{display:block;background:radial-gradient(circle at 20% 20%,rgba(99,102,241,.06),transparent 40%),radial-gradient(circle at 80% 80%,rgba(168,85,247,.05),transparent 40%)}
        .node-rect{fill:var(--bg);stroke:var(--bd2);stroke-width:1.5;cursor:pointer;transition:all var(--t-fast);rx:6;ry:6}
        .node-rect:hover{stroke:var(--pri);stroke-width:2;filter:drop-shadow(0 4px 12px rgba(99,102,241,.4))}
        .node-rect.blocked{fill:var(--dng-soft);stroke:var(--dng)}
        .node-rect.done{opacity:.65}
        .node-title{font-family:'Inter',sans-serif;font-size:11.5px;font-weight:600;fill:var(--tx);pointer-events:none}
        .node-meta{font-family:'Inter',sans-serif;font-size:9.5px;fill:var(--tx3);pointer-events:none}
        .node-strip{pointer-events:none}
        .dep-line{fill:none;stroke:var(--tx3);stroke-width:1.5;marker-end:url(#arrowhead);opacity:.55;transition:opacity var(--t-fast)}
        .dep-line.blocks{stroke:var(--wrn)}
        .dep-line.blocked{stroke:var(--dng)}
        .dep-line.highlight{opacity:1;stroke-width:2.5}
        .node-hover .dep-line{opacity:.15}
        .node-hover .dep-line.highlight{opacity:1}
        .graph-legend{display:flex;gap:16px;flex-wrap:wrap;padding:8px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:var(--rl);margin-bottom:10px;font-size:var(--fs-xs)}
        .graph-legend div{display:flex;align-items:center;gap:6px;color:var(--tx2)}
        .graph-legend .dot{width:10px;height:10px;border-radius:50%}
        .graph-toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
        .mob-toggle{display:none;position:fixed;top:.5rem;left:.5rem;z-index:1100;width:34px;height:34px;background:var(--card);border:1px solid var(--bd);border-radius:6px;color:var(--tx);cursor:pointer;place-content:center}
        @media(max-width:900px){.pm-shell{grid-template-columns:1fr}.pm-sidebar{position:fixed;transform:translateX(-100%);transition:transform var(--t);width:var(--sb)}.pm-sidebar.open{transform:translateX(0)}.mob-toggle{display:grid}.pm-header{padding-left:2.5rem}}
    </style>
</head>
<body>
<button class="mob-toggle" id="mobToggle"><i class="fas fa-bars"></i></button>

<div class="pm-shell" id="pmShell">
    <aside class="pm-sidebar" id="pmSidebar">
        <div class="pm-brand"><div class="pm-brand-logo">M</div><div class="pm-brand-name">Menti's PM</div></div>
        <div class="pm-sidebar-scroll" id="pmSidebarNav"></div>
    </aside>

    <div class="pm-main">
        <header class="pm-header">
            <button class="pm-iconbtn" onclick="PM.toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="pm-search"><i class="fas fa-search"></i><input placeholder="Search tasks..." id="gSearch" oninput="renderGraph()"></div>
            <div class="pm-header-right">
                <div class="pm-live"><span class="dot"></span> Live</div>
                <button class="pm-iconbtn" onclick="PM.toggleTheme()"><i class="fas fa-moon"></i></button>
                <div class="pm-avatar" id="pmUserAvatar" title="Loading...">?</div>
            </div>
        </header>

        <div class="pm-content">
            <div class="pm-breadcrumb"><a href="/pm/01-home"><i class="fas fa-house"></i></a> / Tasks / <span>Dependency Graph</span></div>

            <div class="pm-page-head">
                <div>
                    <div class="pm-page-title"><i class="fas fa-diagram-project"></i> Dependency Graph</div>
                    <div class="pm-page-sub">Visual map of task blocks and blocked-by relationships · <span id="gCount">0</span> tasks · <span id="gEdges">0</span> edges</div>
                </div>
                <div class="pm-page-actions">
                    <button class="pm-btn" onclick="refreshGraph()"><i class="fas fa-sync"></i> Refresh</button>
                    <button class="pm-btn" onclick="zoomGraph(1.2)"><i class="fas fa-magnifying-glass-plus"></i></button>
                    <button class="pm-btn" onclick="zoomGraph(0.8)"><i class="fas fa-magnifying-glass-minus"></i></button>
                    <button class="pm-btn" onclick="zoomGraph(1)"><i class="fas fa-expand"></i> Reset</button>
                    <button class="pm-btn" onclick="location.href='/pm/06-tasks'"><i class="fas fa-arrow-left"></i> Task Board</button>
                </div>
            </div>

            <div class="graph-legend">
                <div><span class="dot" style="background:var(--pri)"></span> To Do</div>
                <div><span class="dot" style="background:var(--wrn)"></span> In Progress</div>
                <div><span class="dot" style="background:var(--pur)"></span> In Review</div>
                <div><span class="dot" style="background:var(--dng)"></span> Blocked</div>
                <div><span class="dot" style="background:var(--suc)"></span> Done</div>
                <div style="margin-left:auto;color:var(--tx3)"><i class="fas fa-arrow-right"></i> Arrow = "blocks"</div>
            </div>

            <div class="graph-toolbar">
                <select class="pm-select" style="max-width:220px" id="gProject" onchange="renderGraph()">
                    <option value="">All Projects</option>
                </select>
                <select class="pm-select" style="max-width:180px" id="gTeam" onchange="renderGraph()">
                    <option value="">All Teams</option>
                </select>
                <label style="display:flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--tx2);cursor:pointer;margin-left:auto">
                    <input type="checkbox" id="gOnlyBlocked" onchange="renderGraph()" style="accent-color:var(--pri)"> Only tasks with dependencies
                </label>
            </div>

            <div class="graph-wrap" id="graphWrap">
                <svg id="graphSvg" class="graph-svg" width="2400" height="1200" viewBox="0 0 2400 1200">
                    <defs>
                        <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--tx3)"/>
                        </marker>
                    </defs>
                    <g id="graphLayer"></g>
                </svg>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script src="/pm/pm-core.js"></script>
<script>
    PM.bootstrap().then(function(me){

        var tasks=[];
        var edges=[];
        var allProjects=[];
        var allTeams=[];
        var currentZoom=1;

        function mapStatus(s){ return (s||'TODO').toLowerCase().replace(/_/g,'-'); }

        function loadTasks(){
          return PM.api('GET','/api/pm/tasks?page=0&size=300').then(function(content){
            tasks=(content||[]).map(function(t){
              return { id:t.id, title:t.title, status: mapStatus(t.status), priority:(t.priority||'MEDIUM').charAt(0)+(t.priority||'MEDIUM').slice(1).toLowerCase(), teamId:t.teamId||null, teamName:t.teamName||null, projectId:t.projectId, projectName:t.projectName||('Project #'+t.projectId), openBlockerCount:t.openBlockerCount||0 };
            });
          }).catch(function(e){ console.warn('loadTasks', e); tasks=[]; });
        }
        function loadProjects(){
          return PM.api('GET','/api/pm/projects?page=0&size=200').then(function(content){
            allProjects=(content||[]).map(function(p){ return {id:p.id, name:p.name}; });
            var sel=document.getElementById('gProject');
            sel.innerHTML='<option value="">All Projects</option>'+allProjects.map(function(p){ return '<option value="'+p.id+'">'+PM.esc(p.name)+'</option>'; }).join('');
          }).catch(function(){});
        }
        function loadTeams(){
          return PM.api('GET','/api/pm/teams/dropdown').then(function(list){
            allTeams=(list||[]).map(function(t){ return {id:t.id, name:t.name}; });
            var sel=document.getElementById('gTeam');
            sel.innerHTML='<option value="">All Teams</option>'+allTeams.map(function(t){ return '<option value="'+t.id+'">'+PM.esc(t.name)+'</option>'; }).join('');
          }).catch(function(){});
        }
        function loadEdges(){
          return Promise.all(tasks.map(function(t){
            return PM.api('GET','/api/pm/tasks/'+t.id+'/dependencies/graph').then(function(data){
              data=data||{blocks:[],blockedBy:[]};
              var out=[];
              (data.blockedBy||[]).forEach(function(d){ out.push({from:d.taskId, to:t.id, type:'BLOCKED_BY'}); });
              (data.blocks||[]).forEach(function(d){ out.push({from:t.id, to:d.taskId, type:'BLOCKS'}); });
              return out;
            }).catch(function(){ return []; });
          })).then(function(chunks){
            var merged=[]; var seen={};
            chunks.forEach(function(arr){ arr.forEach(function(e){ var key=e.from+'-'+e.to; if(!seen[key]){ seen[key]=true; merged.push(e); } }); });
            edges=merged;
          });
        }

        function computeLayout(list){
          var W=2400, H=1200;
          var NODE_W=200, NODE_H=52, COL_GAP=120, ROW_GAP=16;
          var byProject={};
          list.forEach(function(t){ var k=t.projectId||0; if(!byProject[k]) byProject[k]={ projectId:k, projectName:t.projectName, items:[] }; byProject[k].items.push(t); });
          var groups=Object.values(byProject).sort(function(a,b){ return a.projectName.localeCompare(b.projectName); });
          var maxRows=Math.max.apply(null, groups.map(function(g){ return g.items.length; }));
          H = Math.max(H, maxRows*(NODE_H+ROW_GAP)+120);
          W = Math.max(W, groups.length*(NODE_W+COL_GAP)+80);
          var positions={};
          groups.forEach(function(g, gi){
            var x = 60 + gi*(NODE_W+COL_GAP);
            g.items.sort(function(a,b){ if(a.status!==b.status) return a.status==='done' ? 1 : -1; return a.title.localeCompare(b.title); });
            g.items.forEach(function(t, ti){ var y = 60 + ti*(NODE_H+ROW_GAP); positions[t.id] = { x: x, y: y, w: NODE_W, h: NODE_H }; });
          });
          return { positions: positions, width: W, height: H };
        }

        function statusColor(s){ return s==='done'?'var(--suc)':s==='in-progress'?'var(--wrn)':s==='in-review'?'var(--pur)':s==='blocked'?'var(--dng)':'var(--pri)'; }

        function renderGraph(){
          var q=(document.getElementById('gSearch').value||'').toLowerCase();
          var pid=parseInt(document.getElementById('gProject').value||'0');
          var tid=parseInt(document.getElementById('gTeam').value||'0');
          var onlyDep=document.getElementById('gOnlyBlocked').checked;
          var list=tasks.filter(function(t){ if(q && !t.title.toLowerCase().includes(q)) return false; if(pid && t.projectId!==pid) return false; if(tid && t.teamId!==tid) return false; return true; });
          if(onlyDep){ var withEdges={}; edges.forEach(function(e){ withEdges[e.from]=true; withEdges[e.to]=true; }); list=list.filter(function(t){ return withEdges[t.id]; }); }
          document.getElementById('gCount').textContent=list.length;
          var visibleIds={}; list.forEach(function(t){ visibleIds[t.id]=true; });
          var visibleEdges=edges.filter(function(e){ return visibleIds[e.from] && visibleIds[e.to]; });
          document.getElementById('gEdges').textContent=visibleEdges.length;
          var layout=computeLayout(list);
          var svg=document.getElementById('graphSvg'); var g=document.getElementById('graphLayer');
          svg.setAttribute('width', layout.width); svg.setAttribute('height', layout.height); svg.setAttribute('viewBox', '0 0 '+layout.width+' '+layout.height);
          var html='';
          visibleEdges.forEach(function(e){
            var p1=layout.positions[e.from]; var p2=layout.positions[e.to];
            if(!p1 || !p2) return;
            var x1=p1.x+p1.w, y1=p1.y+p1.h/2, x2=p2.x, y2=p2.y+p2.h/2;
            var midX=(x1+x2)/2;
            var path='M '+x1+' '+y1+' C '+midX+' '+y1+', '+midX+' '+y2+', '+x2+' '+y2;
            var cls = e.type==='BLOCKED_BY' ? 'dep-line blocked' : 'dep-line blocks';
            html+='<path class="'+cls+'" data-from="'+e.from+'" data-to="'+e.to+'" d="'+path+'"/>';
          });
          list.forEach(function(t){
            var p=layout.positions[t.id]; if(!p) return;
            var color=statusColor(t.status);
            var blockedCls = t.openBlockerCount>0 ? ' blocked' : '';
            var doneCls = t.status==='done' ? ' done' : '';
            var shortTitle = t.title.length>26 ? t.title.substring(0,25)+'…' : t.title;
            html+='<g class="node" data-id="'+t.id+'"><rect class="node-rect'+blockedCls+doneCls+'" x="'+p.x+'" y="'+p.y+'" width="'+p.w+'" height="'+p.h+'" rx="6" ry="6"/><rect class="node-strip" x="'+p.x+'" y="'+p.y+'" width="4" height="'+p.h+'" fill="'+color+'" rx="6" ry="0"/><text class="node-title" x="'+(p.x+14)+'" y="'+(p.y+20)+'">'+PM.esc(shortTitle)+'</text><text class="node-meta" x="'+(p.x+14)+'" y="'+(p.y+38)+'">'+PM.esc(t.priority)+(t.teamName?' · '+PM.esc(t.teamName):'')+'</text>'+(t.openBlockerCount>0?'<text class="node-meta" x="'+(p.x+p.w-8)+'" y="'+(p.y+20)+'" text-anchor="end" fill="var(--dng)"><tspan>🚫</tspan></text>':'')+'</g>';
          });
          g.innerHTML=html;
          g.querySelectorAll('.node').forEach(function(node){
            node.addEventListener('mouseenter', function(){ highlightNode(parseInt(node.dataset.id)); });
            node.addEventListener('mouseleave', function(){ clearHighlight(); });
            node.addEventListener('click', function(){ openNode(parseInt(node.dataset.id)); });
          });
        }

        function highlightNode(id){
          var svg=document.getElementById('graphSvg');
          svg.classList.add('node-hover');
          svg.querySelectorAll('.dep-line').forEach(function(l){ if(parseInt(l.dataset.from)===id || parseInt(l.dataset.to)===id) l.classList.add('highlight'); });
          svg.querySelectorAll('.node').forEach(function(n){ if(parseInt(n.dataset.id)!==id) n.style.opacity='.35'; });
        }
        function clearHighlight(){
          var svg=document.getElementById('graphSvg');
          svg.classList.remove('node-hover');
          svg.querySelectorAll('.dep-line').forEach(function(l){ l.classList.remove('highlight'); });
          svg.querySelectorAll('.node').forEach(function(n){ n.style.opacity='1'; });
        }
        function zoomGraph(factor){
          currentZoom = Math.max(0.3, Math.min(3, currentZoom * factor));
          var svg=document.getElementById('graphSvg');
          var baseW=parseFloat(svg.getAttribute('data-base-w') || svg.getAttribute('width'));
          var baseH=parseFloat(svg.getAttribute('data-base-h') || svg.getAttribute('height'));
          if(!svg.getAttribute('data-base-w')){ svg.setAttribute('data-base-w', baseW); svg.setAttribute('data-base-h', baseH); }
          svg.style.width=(baseW*currentZoom)+'px';
          svg.style.height=(baseH*currentZoom)+'px';
        }
        function refreshGraph(){
          PM.toast('Refreshing…','info');
          Promise.all([loadTasks(), loadProjects(), loadTeams()]).then(loadEdges).then(renderGraph).then(function(){ PM.toast('✓ Graph refreshed','success'); });
        }
        function openNode(id){
          var t=tasks.find(function(x){ return x.id===id; });
          if(!t){ PM.toast('Task not found','error'); return; }
          var sb={todo:['primary','To Do'],'in-progress':['warning','In Progress'],blocked:['danger','Blocked'],'in-review':['info','In Review'],done:['success','Done']};
          var label=sb[t.status]||['primary',t.status];
          var inbound=edges.filter(function(e){ return e.to===id; });
          var outbound=edges.filter(function(e){ return e.from===id; });
          var html='';
          html+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px"><span class="pm-badge '+label[0]+'">'+label[1]+'</span><span class="pm-badge primary">'+PM.esc(t.priority)+'</span>'+(t.teamName?'<span class="pm-badge purple">'+PM.esc(t.teamName)+'</span>':'')+'</div>';
          html+='<div style="font-size:var(--fs-lg);font-weight:600;margin-bottom:8px">'+PM.esc(t.title)+'</div>';
          html+='<div style="font-size:var(--fs-sm);color:var(--tx3);margin-bottom:12px">Project: '+PM.esc(t.projectName)+'</div>';
          if(t.openBlockerCount>0){ html+='<div style="background:var(--dng-soft);border:1px solid rgba(239,68,68,.3);padding:10px;border-radius:var(--rl);margin-bottom:10px"><div style="color:var(--dng);font-weight:600;font-size:var(--fs-md)"><i class="fas fa-ban"></i> Blocked by '+t.openBlockerCount+' task(s)</div></div>'; }
          if(inbound.length){
            html+='<div class="pm-card"><div style="font-size:var(--fs-xs);color:var(--tx3);text-transform:uppercase;font-weight:700;margin-bottom:6px">Depends on ('+inbound.length+')</div>';
            inbound.forEach(function(e){ var ot=tasks.find(function(x){ return x.id===e.from; }); if(!ot) return; html+='<div style="padding:6px 10px;background:var(--bg);border-radius:var(--r);margin-bottom:4px;border-left:3px solid '+(ot.status==='done'?'var(--suc)':'var(--wrn)')+'"><i class="fas fa-arrow-left" style="color:var(--tx3);font-size:10px"></i> '+PM.esc(ot.title)+'</div>'; });
            html+='</div>';
          }
          if(outbound.length){
            html+='<div class="pm-card"><div style="font-size:var(--fs-xs);color:var(--tx3);text-transform:uppercase;font-weight:700;margin-bottom:6px">Blocks ('+outbound.length+')</div>';
            outbound.forEach(function(e){ var ot=tasks.find(function(x){ return x.id===e.to; }); if(!ot) return; html+='<div style="padding:6px 10px;background:var(--bg);border-radius:var(--r);margin-bottom:4px;border-left:3px solid var(--wrn)"><i class="fas fa-arrow-right" style="color:var(--tx3);font-size:10px"></i> '+PM.esc(ot.title)+'</div>'; });
            html+='</div>';
          }
          if(!inbound.length && !outbound.length){ html+='<div style="text-align:center;padding:16px;color:var(--tx3);font-size:var(--fs-sm)">No dependencies</div>'; }
          html+='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="pm-btn pm-btn-primary" style="flex:1;justify-content:center" onclick="location.href=\'/pm/06-tasks?open='+t.id+'\'"><i class="fas fa-folder-open"></i> Open Task</button><button class="pm-btn" onclick="centerOnNode('+t.id+')"><i class="fas fa-crosshairs"></i></button></div>';
          PM.openDrawer(html, t.title);
        }
        function centerOnNode(id){
          PM.closeDrawer();
          var node=document.querySelector('.node[data-id="'+id+'"]'); if(!node) return;
          var rect=node.querySelector('rect');
          var wrap=document.getElementById('graphWrap');
          var x=parseFloat(rect.getAttribute('x')); var y=parseFloat(rect.getAttribute('y'));
          wrap.scrollTo({ left: x-200, top: y-200, behavior:'smooth' });
          highlightNode(id);
          setTimeout(clearHighlight, 2000);
        }

        window.zoomGraph = zoomGraph;
        window.refreshGraph = refreshGraph;
        window.openNode = openNode;
        window.centerOnNode = centerOnNode;
        window.renderGraph = renderGraph;

        document.getElementById('mobToggle').addEventListener('click',function(){ document.getElementById('pmSidebar').classList.toggle('open'); });

        Promise.all([loadTasks(), loadProjects(), loadTeams()]).then(loadEdges).then(renderGraph).then(function(){ PM.toast('Loaded '+tasks.length+' tasks, '+edges.length+' edges','success'); });
    });
</script>
</body>
</html>
