<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>PM · Inbox</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0f172a;--bg2:#131c31;--card:#1e293b;--card2:#243347;--bd:#2a3950;--tx:#f1f5f9;--tx2:#94a3b8;--tx3:#64748b;--pri:#6366f1;--pur:#a855f7;--suc:#10b981;--dng:#ef4444;--wrn:#f59e0b;--pri-soft:rgba(99,102,241,.12);--suc-soft:rgba(16,185,129,.14);--wrn-soft:rgba(245,158,11,.14);--dng-soft:rgba(239,68,68,.14);--sb:232px;--hh:46px;--r:6px}
        .pm-light{--bg:#f8fafc;--bg2:#fff;--card:#fff;--card2:#f1f5f9;--bd:#e2e8f0;--tx:#0f172a;--tx2:#475569;--tx3:#94a3b8}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:Inter,sans-serif;font-size:12.5px;background:var(--bg);color:var(--tx)}
        a{text-decoration:none;color:var(--pri)}
        .pm-shell{display:grid;grid-template-columns:var(--sb) 1fr;min-height:100vh}
        .pm-shell.collapsed{grid-template-columns:56px 1fr}
        .pm-shell.collapsed .pm-nav-label,.pm-shell.collapsed .pm-nav-section,.pm-shell.collapsed .pm-brand-name{display:none}
        .pm-sidebar{position:sticky;top:0;height:100vh;background:var(--bg2);border-right:1px solid var(--bd);display:flex;flex-direction:column}
        .pm-brand{display:flex;align-items:center;gap:8px;padding:10px 12px;height:var(--hh);border-bottom:1px solid var(--bd)}
        .pm-brand-logo{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,var(--pri),var(--pur));display:grid;place-content:center;color:#fff;font-weight:700}
        .pm-sidebar-scroll{flex:1;overflow-y:auto;padding:6px}
        .pm-nav-section{padding:12px 10px 4px;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--tx3)}
        .pm-nav-link{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r);color:var(--tx2);font-weight:500}
        .pm-nav-link:hover{background:var(--card2);color:var(--tx)}
        .pm-nav-link.active{background:var(--pri-soft);color:var(--pri)}
        .pm-nav-link i{width:16px;text-align:center}.pm-nav-label{flex:1}
        .pm-nav-badge{background:var(--pri);color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px}
        .pm-header{position:sticky;top:0;height:var(--hh);background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:0 10px;z-index:50}
        .pm-iconbtn{width:30px;height:30px;border-radius:var(--r);border:1px solid var(--bd);background:transparent;color:var(--tx2);cursor:pointer}
        .pm-live{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--tx3);font-weight:600}
        .pm-live .dot{width:6px;height:6px;border-radius:50%;background:var(--suc)}
        .pm-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--pri),var(--pur));color:#fff;font-weight:700;font-size:11px;display:grid;place-content:center;cursor:pointer}
        .pm-content{padding:14px;max-width:960px}
        .pm-title{font-size:18px;font-weight:600;margin:6px 0 12px}
        .pm-tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:12px}
        .pm-tabs button{background:none;border:none;color:var(--tx2);padding:8px 12px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent}
        .pm-tabs button.active{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
        .pm-tabs button:hover{color:var(--tx)}
        .row{display:flex;gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;margin-bottom:6px}
        .row:hover{background:var(--card2)}
        .row .av{width:28px;height:28px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-content:center;font-weight:700;font-size:11px;flex-shrink:0}
        .row .msg{font-weight:500}.row .meta{font-size:11px;color:var(--tx3);margin-top:2px}
        .badge{padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700;background:var(--pri-soft);color:var(--pri);margin-left:6px;display:inline-block}
        .empty{text-align:center;padding:40px;color:var(--tx3);background:var(--card);border:1px dashed var(--bd);border-radius:8px}
        .pm-toasts{position:fixed;top:12px;right:12px;z-index:2000;display:flex;flex-direction:column;gap:6px}
        .pm-toast{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--pri);border-radius:8px;padding:8px 12px;opacity:0;transition:opacity .3s}
        .pm-toast.show{opacity:1}
    </style>
</head>
<body>
<div class="pm-shell" id="pmShell">
    <aside class="pm-sidebar">
        <div class="pm-brand"><div class="pm-brand-logo">M</div><div class="pm-brand-name">Menti's PM</div></div>
        <div class="pm-sidebar-scroll" id="pmSidebarNav"></div>
    </aside>
    <div class="pm-main">
        <header class="pm-header">
            <button class="pm-iconbtn" onclick="PM.toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="pm-live"><span class="dot"></span> Live</div>
            <button class="pm-iconbtn" onclick="PM.toggleTheme()"><i class="fas fa-moon"></i></button>
            <div class="pm-avatar" id="pmUserAvatar">?</div>
            <button class="pm-iconbtn" onclick="location.href='/pm/02-inbox?tab=notifications'"><i class="fas fa-bell"></i><span class="dot" id="pmNotifBadge">0</span></button>
        </header>
        <div class="pm-content">
            <div class="pm-title"><i class="fas fa-inbox" style="color:var(--pri)"></i> Inbox</div>
            <div class="pm-tabs" id="tabs">
                <button data-tab="notifications" class="active">Notifications</button>
                <button data-tab="approvals">Approvals</button>
                <button data-tab="activity">Activity Logs</button>
            </div>
            <div id="list"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
<script src="/pm/pm-core.js"></script>
<script src="/pm/pm-approvals.js"></script>
<script src="/webjars/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="/webjars/stomp-websocket/2.3.4/lib/stomp.min.js"></script>
<script>
    (function () {
      var tab = (location.search.match(/tab=(\w+)/) || [])[1] || 'notifications';
      var me = null;

      /* ══════════════════════════════════════════════════════════
         NOTIFICATIONS TAB
         ══════════════════════════════════════════════════════════ */
      var NOTIF_FILTERS = [
        { k:'all',            label:'All' },
        { k:'TASK_MENTIONED', label:'Mentions' },
        { k:'TASK_ASSIGNED',  label:'Assigned' },
        { k:'CARD_MOVED',     label:'Moves' },
        { k:'COMMENT_ADDED',  label:'Comments' },
        { k:'DUE_SOON',       label:'Due Soon' },
              { k:'OVERDUE',      label:'Overdue' },
        { k:'attention',    label:'Needs my attention', types:['TASK_BLOCKED','TASK_BLOCKED_LONG','TASK_ESCALATION','TASK_IN_REVIEW','TASK_SENT_BACK','TASK_MENTIONED','OVERDUE_DIGEST'], unreadOnly:true },
        { k:'blocked',      label:'Blocked', types:['TASK_BLOCKED','TASK_BLOCKED_LONG','TASK_ESCALATION'] },
        { k:'review',       label:'Review', types:['TASK_IN_REVIEW','TASK_SENT_BACK'] }
      ];
      var activeNotifFilter = 'all';

      function whenLabel(iso) {
        if (!iso) return '';
        try {
          var d = new Date(iso);
          var diff = (Date.now() - d.getTime()) / 1000;
          if (diff < 60) return 'just now';
          if (diff < 3600) return Math.floor(diff/60) + 'm ago';
          if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
          return Math.floor(diff/86400) + 'd ago';
        } catch (e) { return ''; }
      }

      function priorityColor(p) {
        if (p === 'HIGH') return 'var(--dng)';
        if (p === 'LOW')  return 'var(--tx3)';
        return 'var(--pri)';
      }

      var NOTIF_ICON = {
    TASK_BLOCKED:'fa-ban', TASK_BLOCKED_LONG:'fa-hourglass-half', TASK_ESCALATION:'fa-triangle-exclamation',
    TASK_IN_REVIEW:'fa-magnifying-glass', TASK_DONE:'fa-circle-check', TASK_SENT_BACK:'fa-rotate-left',
    OVERDUE_DIGEST:'fa-calendar-xmark'
  };
  function notifAvatar(n) {
    var ic = NOTIF_ICON[n.action || n.type];
    return ic ? '<i class="fas ' + ic + '"></i>' : PM.esc(PM.getInitials(n.sender || 'System'));
  }

  function notifRow(n) {
        var unreadDot = !n.read
          ? '<span style="width:7px;height:7px;border-radius:50%;background:var(--pri);display:inline-block;margin-right:8px;"></span>'
          : '<span style="width:7px;display:inline-block;margin-right:8px;"></span>';
        return '<div class="row" style="cursor:pointer;border-left:3px solid ' + priorityColor(n.priority) + ';' +
               (n.read ? '' : 'background:var(--pri-soft);') + '"' +
               ' onclick="onClickNotif(' + n.id + ', \'' + (n.deepLink || '').replace(/'/g, '') + '\')">' +
          unreadDot +
               '<div class="av">' + notifAvatar(n) + '</div>' +
          '<div style="flex:1;min-width:0">' +
            '<div class="msg">' + PM.esc(n.title || '') +
              '<span class="badge">' + PM.esc((n.action || '').replace(/_/g, ' ')) + '</span></div>' +
            '<div class="meta">' + PM.esc(n.message || '') + '</div>' +
            '<div class="meta" style="opacity:.7;">' + whenLabel(n.createdAt) +
              (n.projectId ? ' · project #' + n.projectId : '') +
              (n.taskId ? ' · task #' + n.taskId : '') +
            '</div>' +
          '</div></div>';
      }

      window.onClickNotif = function (id, deepLink) {
        fetch('/api/pm/notifications/' + id + '/read', {
          method:'POST', credentials:'same-origin',
          headers:{'X-Requested-With':'XMLHttpRequest'}
        }).then(function(){
          window.Notifications && window.Notifications.refresh();
          if (deepLink) window.location.href = deepLink;
          else loadNotifications();
        });
      };

      async function loadNotifications() {
        var box = document.getElementById('list');
        if (!box) return;
        var chipsHtml = '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">' +
          NOTIF_FILTERS.map(function (f) {
            return '<button class="pm-btn' + (activeNotifFilter === f.k ? ' pm-btn-primary' : '') +
              '" style="height:24px;font-size:11.5px;" onclick="filterNotif(\'' + f.k + '\')">' + f.label + '</button>';
          }).join('') +
          '<button class="pm-btn pm-btn-sm" style="margin-left:auto;" onclick="markAllNotifRead()">' +
          '<i class="fas fa-check-double"></i> Mark all read</button></div>';

        try {
               var f = NOTIF_FILTERS.filter(function (x) { return x.k === activeNotifFilter; })[0];
        var grouped = f && f.types;
        var url = '/api/pm/notifications?limit=' + (grouped ? 200 : 50) +
                  (activeNotifFilter !== 'all' && !grouped ? '&filter=' + activeNotifFilter : '');
        var list = await PM.api('GET', url) || [];
        if (grouped) list = list.filter(function (n) {
          return f.types.indexOf(n.action || n.type) >= 0 && (!f.unreadOnly || !n.read);
        });
          box.innerHTML = chipsHtml + (list.length
            ? list.map(notifRow).join('')
            : '<div class="empty"><i class="fas fa-bell-slash" style="font-size:22px"></i><div style="margin-top:8px">Nothing here yet.</div></div>');
        } catch (e) {
          box.innerHTML = chipsHtml + '<div class="empty">Failed: ' + PM.esc(e.message) + '</div>';
        }
      }

      window.filterNotif = function (k) { activeNotifFilter = k; loadNotifications(); };
      window.markAllNotifRead = function () {
        if (window.Notifications) window.Notifications.markAllRead().then(loadNotifications);
      };

      /* ══════════════════════════════════════════════════════════
         ACTIVITY LOGS TAB
         ══════════════════════════════════════════════════════════ */
      function activityRow(a) {
        var who = a.actorName || 'System';
        return '<div class="row"><div class="av">' + PM.esc(PM.getInitials(who)) + '</div><div style="flex:1">' +
          '<div class="msg">' + PM.esc(who) + ' — ' + PM.esc(a.message || a.action) +
          '<span class="badge">' + PM.esc(a.action || '') + '</span></div>' +
          '<div class="meta">' + PM.esc(a.entityType || '') + ' #' + PM.esc(a.entityId) + ' · ' + PM.fmtDateTime(a.createdAt) + '</div></div></div>';
      }

      async function loadActivity() {
        var box = document.getElementById('list');
        if (!box) return;
        box.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i></div>';
        try {
          var items = await PM.api('GET', '/api/pm/dashboard/recent-activity?limit=20') || [];
          box.innerHTML = items.length
            ? items.map(activityRow).join('')
            : '<div class="empty"><i class="fas fa-clock-rotate-left" style="font-size:22px"></i><div style="margin-top:8px">No activity yet.</div></div>';
        } catch (e) {
          box.innerHTML = '<div class="empty">Failed: ' + PM.esc(e.message) + '</div>';
        }
      }

      /* ══════════════════════════════════════════════════════════
         APPROVALS TAB (Phase 7)
         ══════════════════════════════════════════════════════════ */
      function loadApprovals() {
        if (window.PMApprovals) {
          window.PMApprovals.load();
        } else {
          var box = document.getElementById('list');
          if (box) box.innerHTML = '<div class="empty"><i class="fas fa-spinner fa-spin"></i> Loading approvals…</div>';
          // retry once scripts finish loading
          setTimeout(function () {
            if (window.PMApprovals) window.PMApprovals.load();
            else if (box) box.innerHTML = '<div class="empty">Approvals module failed to load.</div>';
          }, 400);
        }
      }

      /* ══════════════════════════════════════════════════════════
         TAB DISPATCHER
         ══════════════════════════════════════════════════════════ */
      function load() {
        document.querySelectorAll('#tabs button').forEach(function (b) {
          b.classList.toggle('active', b.dataset.tab === tab);
        });

        if (tab === 'approvals') { loadApprovals(); return; }
        if (tab === 'activity')  { loadActivity();  return; }
        loadNotifications();
      }

      window.pmRefresh = load;

      document.getElementById('tabs').addEventListener('click', function (e) {
        if (e.target.dataset.tab) {
          tab = e.target.dataset.tab;
          history.replaceState(null, '', '?tab=' + tab);
          load();
        }
      });

      PM.bootstrap().then(function (u) {
        me = u;
        setTimeout(function () { window.Notifications && window.Notifications.boot(); }, 200);
        load();
      });
    })();
</script>
</body>
</html>
