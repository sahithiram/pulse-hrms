<!-- 1. Head links (no page styles) -->
<th:block th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title th:text="${title}">PM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/menti-theme.css}">
    <link rel="stylesheet" th:href="@{/css/menti-ai.css}">
</th:block>

<!-- 2. Sidebar (the <aside class="sidebar"> block, with mobile burger) -->
<th:block th:fragment="sidebar(active)"> ... </th:block>

<!-- 3. Top header (the <header class="top-header"> block) -->
<header class="top-header" th:fragment="header"> ... </header>

<!-- 4. AI panel + toasts + command palette -->
<th:block th:fragment="aipanel"> ... </th:block>

<!-- 5. Common scripts, in the same order as 01-home -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/menti-sidebar.js}"></script>
    <script th:src="@{/js/menti-ai.js}"></script>
</th:block>
