<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<!-- ============================================ -->
<!-- HEADER FRAGMENT - Reusable across all pages -->
<!-- ============================================ -->
<th:block th:fragment="header">
    <!-- === TOP HEADER WITH USER PROFILE DROPDOWN === -->
    <header class="top-header">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search...">
        </div>

        <div class="top-header-actions">
            <!-- Notification Dropdown -->
            <div class="icon-btn" title="Notifications">
                <i class="fas fa-bell"></i>
                <span class="notification-badge" style="display: none;">0</span>
            </div>

            <!-- User Profile Menu -->
            <div class="user-profile-menu">
                <div class="dropdown">
                    <button class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2"
                            type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="avatar-sm" style="width: 32px; height: 32px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 600; font-size: 0.875rem;"
                             th:text="${#strings.toUpperCase(userName != null ? userName.substring(0, 1) : 'U')}">U</div>
                        <span th:text="${userName}">User Name</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" style="background: var(--dark-card); border: 1px solid var(--dark-border);">
                        <li>
                            <a class="dropdown-item" href="/candidate/auth/change-password" style="color: var(--dark-text);">
                                <i class="fas fa-key me-2"></i>Change Password
                            </a>
                        </li>
                        <li><hr class="dropdown-divider" style="border-color: var(--dark-border);"></li>
                        <li>
                            <a class="dropdown-item text-danger" href="/candidate/auth/logout" style="color: #ef4444;">
                                <i class="fas fa-sign-out-alt me-2"></i>Logout
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
</th:block>

</body>
</html>
