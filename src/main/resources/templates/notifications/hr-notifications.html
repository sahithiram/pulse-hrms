<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Notifications - Menti's IT Solutions</title>

    <!-- =====  EXTERNAL LIBS  ===== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- ===== SHARED THEME ===== -->
    <link rel="stylesheet" th:href="@{/css/menti-theme.css}" href="../../static/css/menti-theme.css">
    <link rel="stylesheet" th:href="@{/css/menti-ai.css}" href="../../static/css/menti-ai.css">

    <style>
        /* Page-specific: card/icon/responsive overrides only — base styling from menti-theme.css */

        .notification-card {
            background: var(--dark-card);
            border: 1px solid var(--dark-border);
            border-radius: 12px;
            padding: 1.25rem;
            transition: var(--transition);
            position: relative;
            margin-bottom: 1rem;
        }
        .notification-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .notification-card.unread {
            border-left: 4px solid var(--primary);
            background: rgba(99,102,241,.05);
        }
        .notification-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: .75rem; gap: 1rem;
        }
        .notification-title {
            font-size: var(--fs-md); font-weight: 600;
            color: var(--dark-text);
            display: flex; align-items: center; gap: .65rem;
        }
        .notification-time {
            font-size: var(--fs-xs);
            color: var(--dark-text-secondary);
            white-space: nowrap;
        }
        .notification-content {
            color: var(--dark-text-secondary);
            line-height: 1.6;
            font-size: var(--fs-base);
            margin-bottom: 1rem;
        }
        .notification-actions {
            display: flex; gap: .5rem;
            justify-content: flex-end;
            padding-top: .85rem;
            border-top: 1px solid var(--dark-border);
            flex-wrap: wrap;
        }
        .notification-icon {
            width: 40px; height: 40px;
            border-radius: 10px;
            display: grid; place-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .icon-success { background: rgba(16,185,129,.1); color: var(--success); }
        .icon-danger  { background: rgba(239,68,68,.1);  color: var(--danger); }
        .icon-info    { background: rgba(14,165,233,.1); color: var(--info); }

        @media (max-width: 768px) {
            .notification-card { padding: 1rem; }
            .notification-title { font-size: var(--fs-base); }
        }
    </style>
</head>
<body>

<!-- === SHARED SIDEBAR (recruitment active) === -->
<div th:replace="~{fragments/layout :: sidebar('applications')}"></div>

<!-- === MAIN CONTENT === -->
<div class="main-content">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <div class="content-area">

        <!-- Page head -->
        <div class="pm-page-head">
            <div>
                <h1 class="pm-page-title">
                    <i class="fas fa-bell"></i>
                    <span>HR Notifications</span>
                </h1>
                <div class="pm-page-sub">Document verifications and candidate activity</div>
            </div>
            <div class="pm-page-actions">
                <span class="pm-badge warning" th:text="${unreadCount} + ' unread'">0 unread</span>
                <button class="pm-btn" onclick="markAllAsRead()">
                    <i class="fas fa-check-double"></i> Mark All Read
                </button>
                <a href="/dashboard/hr" class="pm-btn pm-btn-primary">
                    <i class="fas fa-arrow-left"></i> Back to Dashboard
                </a>
            </div>
        </div>

        <!-- NOTIFICATIONS LIST -->
        <div id="notificationsList">
            <div th:if="${notifications.empty}" class="empty-state">
                <i class="fas fa-bell-slash"></i>
                <h3>No notifications yet</h3>
                <p>When employees upload documents, they'll appear here</p>
            </div>

            <div th:each="notif : ${notifications}"
                 class="notification-card"
                 th:classappend="${notif.read} ? '' : 'unread'">
                <div class="notification-header">
                    <div class="notification-title">
                        <div th:class="'notification-icon ' +
                            (${notif.type == 'DOCUMENT_VERIFIED'} ? 'icon-success' :
                            (${notif.type == 'DOCUMENT_REJECTED'} ? 'icon-danger' : 'icon-info'))">
                            <i th:class="${notif.type == 'DOCUMENT_VERIFIED'} ? 'fas fa-check-circle' :
                                    (${notif.type == 'DOCUMENT_REJECTED'} ? 'fas fa-times-circle' : 'fas fa-file-upload')"></i>
                        </div>
                        <span th:text="${notif.title}">Notification Title</span>
                    </div>
                    <div class="notification-time"
                         th:text="${#temporals.format(notif.createdAt, 'dd MMM yyyy HH:mm')}">—</div>
                </div>

                <div class="notification-content" th:text="${notif.message}">Message</div>

                <div class="notification-actions">
                    <button th:if="${!notif.read}"
                            class="pm-btn pm-btn-sm"
                            th:onclick="'markAsRead(' + ${notif.id} + ')'">
                        <i class="fas fa-check"></i> Mark as Read
                    </button>

                    <a th:if="${notif.referenceId != null and notif.referenceType == 'DOCUMENT'}"
                       th:href="@{/onboarding/download/{id}(id=${notif.referenceId})}"
                       class="pm-btn pm-btn-primary pm-btn-sm">
                        <i class="fas fa-eye"></i> View Document
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- === SHARED AI PANEL === -->
<div th:replace="~{fragments/layout :: aipanel}"></div>

<!-- === SHARED SCRIPTS (Bootstrap + sidebar + AI + toasts) === -->
<div th:replace="~{fragments/layout :: common-scripts}"></div>

<!-- === PAGE-SPECIFIC SCRIPTS (unchanged) === -->
<script>
    function markAsRead(notificationId) {
        fetch(`/notifications/api/${notificationId}/mark-read`, {
            method: 'POST'
        }).then(() => {
            location.reload();
        });
    }

    function markAllAsRead() {
        fetch('/notifications/api/mark-all-read', {
            method: 'POST'
        }).then(() => {
            location.reload();
        });
    }
</script>
</body>
</html>
