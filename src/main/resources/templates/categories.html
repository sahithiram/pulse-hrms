<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - Menti's IT Solutions</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/menti-theme.css}" href="../../static/css/menti-theme.css">
    <link rel="stylesheet" th:href="@{/css/menti-ai.css}" href="../../static/css/menti-ai.css">

    <style>
        .cat-id {
            color: var(--dark-text-secondary);
            font-weight: 600;
            font-size: .875rem;
        }
        .cat-name {
            font-weight: 600;
            display: flex; align-items: center; gap: .75rem;
            color: var(--dark-text); font-size: .95rem;
        }
        .cat-name i { color: var(--primary); font-size: 1.05rem; }
        .text-muted-dark { color: var(--dark-text-secondary); }

        .pagination-wrapper {
            display: flex; justify-content: space-between; align-items: center;
            padding: .85rem 1.25rem;
            background: rgba(0,0,0,.15);
            border-top: 1px solid var(--dark-border);
            gap: 1rem; flex-wrap: wrap;
        }
    </style>
</head>
<body>

<!-- === SHARED SIDEBAR (categories active) === -->
<div th:replace="~{fragments/layout :: sidebar('categories')}"></div>

<div class="main-content">
    <header th:replace="~{fragments/layout :: topbar}"></header>

    <div class="content-area">

        <div class="pm-page-head">
            <div>
                <h1 class="pm-page-title">
                    <i class="fas fa-tags"></i>
                    <span>Categories (Departments)</span>
                </h1>
                <div class="pm-page-sub">All departments from the database</div>
            </div>
        </div>

        <div class="content-card">
            <div class="card-header">
                <h5 class="card-title"><i class="fas fa-list"></i> Department Categories</h5>
            </div>

            <div class="table-container">
                <table class="pm-table">
                    <thead>
                    <tr>
                        <th style="width: 15%;">Category ID</th>
                        <th style="width: 35%;">Category Name</th>
                        <th style="width: 50%;">Description</th>
                    </tr>
                    </thead>
                    <tbody id="tableBody">
                    <tr th:each="dept : ${departments}" class="data-row">
                        <td class="cat-id" th:text="'#' + ${dept.id}">#1</td>
                        <td>
                            <div class="cat-name">
                                <i class="fas fa-building"></i>
                                <span th:text="${dept.name}">Name</span>
                            </div>
                        </td>
                        <td class="text-muted-dark"
                            th:text="${dept.description != null ? dept.description : 'No description provided.'}">Description</td>
                    </tr>
                    <tr th:if="${departments == null or departments.empty}" class="empty-state-row">
                        <td colspan="3" style="text-align:center; padding:2rem; color:var(--dark-text-secondary);">
                            <i class="fas fa-folder-open" style="font-size:2rem; opacity:.35; display:block; margin-bottom:.5rem;"></i>
                            No categories generated yet. Please create a Department first.
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="pagination-wrapper" id="paginationContainer" style="display: none;">
                <div id="paginationInfo" style="color:var(--dark-text-secondary); font-size:.875rem;">Showing 0 entries</div>
                <nav>
                    <ul id="pagination" style="display:flex; gap:.25rem; list-style:none; margin:0; padding:0;"></ul>
                </nav>
            </div>
        </div>
    </div>
</div>

<!-- === SHARED AI PANEL === -->
<div th:replace="~{fragments/layout :: aipanel}"></div>

<!-- === SHARED SCRIPTS === -->
<div th:replace="~{fragments/layout :: common-scripts}"></div>

<!-- === PAGE-SPECIFIC SCRIPTS (unchanged) === -->
<script>
    'use strict';

    let currentPage = 1;
    const rowsPerPage = 10;
    let allRows = [];

    document.addEventListener('DOMContentLoaded', function () {
        var tbody = document.getElementById('tableBody');
        if (!tbody) return;
        allRows = Array.prototype.slice.call(tbody.querySelectorAll('tr.data-row'));
        if (allRows.length) {
            document.getElementById('paginationContainer').style.display = 'flex';
            renderTablePage();
        }
    });

    function renderTablePage() {
        var total = allRows.length;
        var totalPages = Math.max(1, Math.ceil(total / rowsPerPage));

        allRows.forEach(function (r) { r.style.display = 'none'; });

        var start = (currentPage - 1) * rowsPerPage;
        var end = Math.min(start + rowsPerPage, total);
        for (var i = start; i < end; i++) allRows[i].style.display = '';

        document.getElementById('paginationInfo').textContent =
            'Showing ' + (start + 1) + '-' + end + ' of ' + total + ' entries';

        var pag = document.getElementById('pagination');
        pag.innerHTML = '';

        pag.appendChild(makeBtn('chevron-left', currentPage === 1, function () { currentPage--; renderTablePage(); }));
        for (var p = 1; p <= totalPages; p++) {
            (function (pageNum) {
                pag.appendChild(makeBtn(String(pageNum), false, function () { currentPage = pageNum; renderTablePage(); }, pageNum === currentPage));
            })(p);
        }
        pag.appendChild(makeBtn('chevron-right', currentPage === totalPages, function () { currentPage++; renderTablePage(); }));
    }

    function makeBtn(label, disabled, onClick, active) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = '#';
        a.innerHTML = /^chevron/.test(label) ? '<i class="fas fa-' + label + '"></i>' : label;
        a.style.cssText = 'display:inline-flex; align-items:center; justify-content:center; ' +
            'min-width:32px; height:32px; border-radius:6px; ' +
            'background:' + (active ? 'var(--primary)' : 'var(--dark-bg)') + '; ' +
            'color:' + (active ? '#fff' : 'var(--dark-text-secondary)') + '; ' +
            'border:1px solid ' + (active ? 'var(--primary)' : 'var(--dark-border)') + '; ' +
            'font-size:.8rem; text-decoration:none; opacity:' + (disabled ? '.4' : '1') + '; ' +
            'pointer-events:' + (disabled ? 'none' : 'auto') + ';';
        a.addEventListener('click', function (e) { e.preventDefault(); if (!disabled) onClick(); });
        li.appendChild(a);
        return li;
    }
</script>
</body>
</html>
