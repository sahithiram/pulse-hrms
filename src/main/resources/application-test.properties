# Test slice configuration (profile "test", used by BaseIntegrationTest via @ActiveProfiles("test")).
# Tests run on an in-memory H2 database. No MySQL and no password are needed.

# NOTE: the URL must contain "testdb", because BaseIntegrationTest refuses any other URL.
# NON_KEYWORDS: columns named year / day are reserved words in H2 (they are fine in MySQL).
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=YEAR,DAY,MONTH,VALUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 starts empty, so Hibernate must build the tables, then drop them at the end.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Never use Flyway migrations in tests.
spring.flyway.enabled=false

# Keep scheduled jobs quiet during tests; mail must never leave the building.
hrms.integrity.cron=0 0 0 1 1 ? 2099
spring.mail.host=localhost
spring.mail.port=25

# Quieter logs
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.deprecation=ERROR
logging.level.com.zaxxer.hikari=WARN

# --- To run tests against real local MySQL instead, replace the H2 lines above with: ---
# spring.datasource.url=jdbc:mysql://localhost:3306/mentis_hrms_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
# spring.datasource.username=root
# spring.datasource.password=YOUR_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=none